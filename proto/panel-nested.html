<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>两面包夹芝士 · 三层嵌套侧栏原型</title>
<style>
  /*
   * 界面本身不带颜色。颜色只属于内容：波形、标记点、播放头，外加唯一的强调色。
   * 分块靠留白与材质差，不靠描边。
   */
  :root{
    color-scheme: light dark;
    --label: rgba(0,0,0,.85);
    --label2: rgba(0,0,0,.5);
    --label3: rgba(0,0,0,.32);
    --chip: rgba(0,0,0,.05);
    --chipHi: rgba(0,0,0,.095);
    --sunken: rgba(0,0,0,.045);
    --hair: rgba(0,0,0,.1);
    --bad: #ff3b30;
    --accent: #0a84ff;
    --onAccent: #fff;
    --bread: rgba(0,0,0,.42);
    --muted: rgba(0,0,0,.3);
    --r: 10px; --rsm: 7px; --rxs: 5px;
    /*
     * 间距标尺（4px 基准，四档）—— 所有 margin / padding / gap 只能从这四档取值
     *   s1  4px  紧凑：列表行上下、进度条与说明文字
     *   s2  8px  组内：轴 / 文字框 / 按钮行 / 生成列表；白卡内边距
     *   s3 12px  块间：白卡与相邻块、圆点行高、卡片内边距、卡片外边距、侧栏左右留白
     *   s4 16px  预留：需要更强层级分隔时用
     * 三条派生规则
     *   1. 每往里一层，内边距降一档：卡片 s3 → 白卡 s2。
     *      窗口（侧栏 / 面板）本身是最外层那张卡片：内边距 s3、块间 s3，
     *      左右留白只由窗口给一次，内部各块不写左右外边距
     *   2. 主轴（片段概览波形）不留标签列，波形起于 --lead 28px，两个圆点行跟着它对位；
     *      次级轴（起 / 止 / 插入点）统一 --labw 38px 标签列，波形起于 74px，同级互相对齐
     *   3. 波形和它上下两个圆点行是一个整体：圆点行永远紧贴波形（0）。
     *      白卡是另一个块 —— 不论展开与否，它与这个整体之间恒留 s3。
     *      展开时由尾巴跨过这 s3 把两者连成一个气泡，所以卡片不与未激活的圆点挤在一起。
     */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --lead: 28px;
    --labw: 38px;
    --page: #E9E9EC;
    /* 子级卡片比窗口更亮一档：靠材质差分层，不用阴影也不用描边。
       窗口 233 → 灰卡（sunken）222 → 白卡 242，一级一层 */
    --rise: #F2F2F4;
  }
  @supports (color: AccentColor){ :root{ --accent:AccentColor; --onAccent:AccentColorText } }
  @media (prefers-color-scheme: dark){
    :root{
      --label: rgba(255,255,255,.9); --label2: rgba(255,255,255,.55); --label3: rgba(255,255,255,.34);
      --chip: rgba(255,255,255,.08); --chipHi: rgba(255,255,255,.14); --sunken: rgba(255,255,255,.055);
      --hair: rgba(255,255,255,.11); --bad:#ff453a;
      --bread: rgba(255,255,255,.4); --muted: rgba(255,255,255,.28);
      --page:#232326;
      --rise:#3A3A40;
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:0;background:var(--page);
    font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    color:var(--label);-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;align-items:flex-start;
  }

  /* 侧栏这一长条 = 最外层那张卡片：内边距 s3、块间 s3，块自己不再写外边距 */
  .panel{
    width:344px;max-height:100vh;overflow-y:auto;overflow-x:hidden;
    padding:var(--s3) var(--s3) 0;        /* 底边不留：底栏自己带 s3 */
    background:var(--page);
    display:flex;flex-direction:column;gap:var(--s3);
  }
  /* 内容区：块间间距一律由容器的 gap 给，子块 margin 全为 0 */
  .pad,.cards{display:flex;flex-direction:column;gap:var(--s3)}
  .foot{
    position:sticky;bottom:0;
    margin:0 calc(-1 * var(--s3));         /* 通栏：抵消窗口内边距，滚动内容不会从两侧露出 */
    padding:var(--s3);
    background:var(--page);border-top:1px solid var(--hair);
    display:flex;gap:var(--s2);align-items:center;
  }
  .foot .spacer{flex:1}

  /* 顶部元信息 */
  .top{display:flex;align-items:center;gap:var(--s2);font-size:11px;color:var(--label2)}
  .top .title{color:var(--label);font-weight:500}
  .top .file{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .tc{margin-left:auto;display:flex;align-items:center;gap:var(--s1);flex:none;font-variant-numeric:tabular-nums}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--label3);flex:none}
  .dot.on{background:var(--accent)}

  /* 播放头（真机里是 IINA 的播放头） */
  /* .plhead 与 .top 的间距由 .pad 的 gap 给 */
  .plrow{display:flex;align-items:center;gap:var(--s2);font-size:11px;color:var(--label2)}
  .track{position:relative;flex:1;height:14px;display:flex;align-items:center;cursor:pointer}
  .track::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--chip)}
  .trackfill{position:absolute;left:0;height:3px;border-radius:2px;background:var(--label3);pointer-events:none}
  .trackph{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--label);
    transform:translateX(-4px);pointer-events:none}

  /* 卡片（第一层：取样片段） */
  .card{
    margin:0;padding:var(--s3);border-radius:var(--r);
    background:var(--sunken);
  }
  .cardhd{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);
    font-size:12px;font-weight:500;color:var(--label)}
  .cardhd .idx{color:var(--label)}
  .cardhd .del{margin-left:0}          /* 空闲空间全给 meta，✕ 紧随其后 */
  .del{border:0;background:transparent;color:var(--label3);cursor:pointer;font:inherit;font-size:12px;
    padding:var(--s1);border-radius:var(--rxs);line-height:1}
  .del:hover{color:var(--bad);background:var(--chip)}

  .axis{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2)}
  .hoverzone > .axis{margin-top:0}      /* 概览波形是主轴，不留标签列 */
  .al{font-size:10.5px;color:var(--label3);width:16px;flex:none;text-align:center}
  .lab{font-size:10.5px;color:var(--label3);width:var(--labw);flex:none}
  .play{width:20px;height:20px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;flex:none;
    display:grid;place-items:center;padding:0;color:var(--label2)}
  .play:hover{background:var(--chipHi);color:var(--label)}
  .play svg{width:8px;height:8px;fill:currentColor}
  canvas.cv{display:block;flex:1;min-width:0;height:30px;border-radius:var(--rsm);background:var(--chip);
    touch-action:none}
  canvas.cv.over{height:38px;cursor:crosshair;background:transparent}   /* 预览波形只有中心线 */
  .hidden{display:none !important}
  /* 展开 / 折叠：0fr → 1fr 的网格行高过渡，内容整块被裁掉而不是硬删 */
  .collapse{display:grid;grid-template-rows:0fr;opacity:0;
    transition:grid-template-rows .19s cubic-bezier(.32,.72,0,1),opacity .15s ease}
  .collapse > div{overflow:hidden;min-height:0}   /* 裁切层本身不能带内外边距 */
  .collapse.vis > div{overflow:visible}           /* 展开稳定后放开裁切：阴影画得出去，换卡滑动不被切 */
  .collapse[data-open="1"]{grid-template-rows:1fr;opacity:1}
  .collapse.noanim{transition:none}
  /* 圆点行：永远紧贴波形。展开时圆点变成三角，与卡片连成一个漫画对话框气泡 */
  .dotsrow,.idots{position:relative;height:var(--s3);margin:0 0 0 var(--lead)}
  .dotbtn{position:absolute;top:0;left:0;width:25px;height:var(--s3);
    border:0;background:transparent;cursor:pointer;padding:0}
  .dotbtn i{position:absolute;left:var(--tip,36%);top:2.5px;width:7px;height:7px;
    border-radius:50%;background:var(--label3);display:block;transform:translateX(-50%);
    transition:opacity .19s ease,transform .19s ease}
  .dotbtn:hover i{background:var(--label)}
  .dotbtn[data-on="1"] i{opacity:0;transform:translateX(-50%) scale(.4)}
  /* 气泡尾巴：整条底边贴着卡片，尖端落在波形上那个点；颜色 = 卡片底色，所以像卡自己长出来的 */
  /* 尾巴高 22px：跨过白卡与圆点行之间的 s3，尖端仍停在离波形 3px 处，底边压进卡片 1px */
  .dotbtn b{position:absolute;left:0;width:25px;height:22px;background:var(--rise);
    opacity:0;pointer-events:none;transition:opacity .19s ease,transform .19s ease}
  .dotsrow .dotbtn b{top:-13px;transform-origin:36% 0;transform:scale(.72);
    clip-path:polygon(0 0,72% 0,var(--tip,36%) 100%)}
  .idots .dotbtn b{bottom:-13px;transform-origin:36% 100%;transform:scale(.72);
    clip-path:polygon(var(--tip,36%) 0,72% 100%,0 100%)}
  .dotbtn[data-on="1"] b{opacity:1;transform:scale(1)}
  canvas.cv.edge{cursor:ew-resize}
  .meta{margin-left:auto;display:flex;gap:var(--s2);font-size:10.5px;color:var(--label3);
    font-variant-numeric:tabular-nums}

  /* 第二层：插入点 */
  .ins,.edgecard{margin:0;padding:var(--s2);border-radius:var(--rsm);background:var(--rise);
    transition:transform .19s ease,opacity .19s ease}
  /* 白卡是独立的一块，与「波形 / 圆点行」这个整体之间恒留 s3（折叠时整块收起，不留空） */
  .edgecard{margin:0 0 var(--s3)}
  .ins{margin:var(--s3) 0 0}
  /* 换卡：新圆点在旧圆点哪一边，新卡就从哪一边进来，旧卡往反方向退 */
  .ins.swap-in,.edgecard.swap-in{transition:none;transform:translateX(var(--sx,0));opacity:0}
  .ins.swap-out,.edgecard.swap-out{transform:translateX(var(--sx,0));opacity:0;
    transition:transform .13s ease,opacity .13s ease}
  .inshd{display:flex;align-items:center;gap:var(--s2);font-size:11.5px;color:var(--label2)}
  .inshd .idx{color:var(--label);font-weight:500}
  .inshd .del{margin-left:auto}
  textarea{
    width:100%;display:block;margin-top:var(--s2);border:0;background:var(--sunken);border-radius:var(--rxs);
    padding:var(--s2);font:inherit;font-size:12.5px;line-height:1.5;color:var(--label);
    resize:none;outline:none;min-height:44px;-webkit-user-select:text
  }
  textarea::placeholder{color:var(--label3)}
  .insacts{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2)}
  .insacts .spacer{flex:1}

  .btn{font:inherit;font-size:12.5px;border:0;background:var(--chip);color:var(--label);
    padding:var(--s1) var(--s3);border-radius:var(--rxs);cursor:pointer}
  .btn:hover{background:var(--chipHi)}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.primary{font-weight:600;background:var(--chipHi)}
  .btn.primary:not([disabled]):hover{background:var(--hair)}
  .btn.accent{background:var(--accent);color:var(--onAccent);font-weight:500}
  .btn.accent:hover{filter:brightness(1.06)}

  .bar{margin-top:var(--s2);height:2px;border-radius:1px;background:var(--chip);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent)}
  .barline{margin-top:var(--s1);font-size:10.5px;color:var(--label2);font-variant-numeric:tabular-nums}

  /* 第三层：生成次数 */
  .takes{margin-top:var(--s2)}
  .take{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0}
  .take .k{font-size:11px;color:var(--label3);width:44px;flex:none;font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .take .play{width:18px;height:18px}
  .take .play svg{width:7px;height:7px}
  .take .spacer{flex:1}
  canvas.cv.take{height:22px;cursor:default}
  .take .bar{flex:1;margin:0;background:var(--hair)}
  .take .pct{font-size:10.5px;color:var(--label3);width:30px;flex:none;text-align:right;
    font-variant-numeric:tabular-nums}
  .take .pick,.take .drop{flex:none}
  .pick,.drop{border:0;background:transparent;color:var(--label3);cursor:pointer;font:inherit;font-size:11.5px;
    padding:var(--s1) var(--s2);border-radius:var(--rxs)}
  .pick:hover{color:var(--accent);background:var(--chip)}
  .drop:hover{color:var(--bad);background:var(--chip)}
  .take[data-sel="1"] .k{color:var(--accent);font-weight:600}
  .take[data-sel="1"] .pick{color:var(--accent)}

  .addrow{display:flex}
  .add{width:100%;justify-content:center;padding:var(--s2)}
  /* 轴下方的小气泡加号：跟着 hover 的灰线走，点它就在这里插一张新卡 */
  .plus{position:absolute;top:0;width:16px;height:16px;border-radius:50%;
    border:0;padding:0;background:var(--rise);color:var(--label2);cursor:pointer;
    display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(.8);
    transition:opacity .12s ease,transform .12s ease,color .12s ease}
  .plus[data-on="1"]{opacity:1;pointer-events:auto;transform:scale(1)}
  .plus:hover{color:var(--label)}
  .plus svg{width:10px;height:10px}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="pad">
    <div class="top">
      <span class="title">两面包夹芝士</span>
      <span class="file">访谈_成片_v7.mp4</span>
      <span class="tc"><span class="dot on"></span><span id="tc">00:42.6</span></span>
    </div>
    <div class="plhead">
      <div class="plrow">
        <span>播放头</span>
        <div class="track" id="track">
          <div class="trackfill" id="trackfill"></div>
          <div class="trackph" id="trackph"></div>
        </div>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="addrow">
      <button class="btn primary add" id="addSample">基于播放进度新增</button>
    </div>
  </div>
  <div class="foot">
    <button class="btn" id="dlAll" disabled>下载所有片段</button>
    <span class="spacer"></span>
    <button class="btn accent" id="insAll" disabled>自动插入所有片段</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 假的音轨：整片 120s，句间有静音间隙 ================= */
  const FILM = 120, SR = 22050;
  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  const rnd = mulberry32(20261026);
  const SEGS = [];
  (function build(){
    let t = 1.2;
    while (t < FILM - 2.5){
      const d = 1.3 + rnd() * 5.4;
      SEGS.push([t, t + d, rnd() * 10]);
      t += d + 0.28 + rnd() * 0.95;
    }
  })();
  const GAPS = [];
  for (let i = 0; i < SEGS.length - 1; i++) GAPS.push([SEGS[i][1], SEGS[i + 1][0]]);

  function segAt(t){
    for (let i = 0; i < SEGS.length; i++) if (t >= SEGS[i][0] && t <= SEGS[i][1]) return i;
    return -1;
  }
  function ampAt(t){
    const i = segAt(t);
    if (i < 0) return 0.012 + 0.008 * Math.abs(Math.sin(t * 0.9));
    const s = SEGS[i];
    const att = Math.min(1, (t - s[0]) / 0.10), dec = Math.min(1, (s[1] - t) / 0.16);
    const syl = Math.abs(Math.sin(t * 27.3 + s[2] * 3.7)) * 0.72 + Math.abs(Math.sin(t * 9.1 + s[2])) * 0.28;
    const wob = 0.72 + 0.28 * Math.sin(t * 1.63 + s[2]);
    return Math.max(0.02, Math.min(1, att * dec * (0.3 + 0.66 * syl) * wob));
  }

  const SNAP_R = 1.2, DRAG_MAGNET = 0.35, MINLEN = 8, MAXLEN = 15;

  function derive(rawB){
    let k = rawB, snapped = false, bestD = SNAP_R, bestC = null;
    for (const g of GAPS){
      const c = (g[0] + g[1]) / 2, d = Math.abs(c - rawB);
      if (d < bestD){ bestD = d; bestC = c; }
    }
    if (bestC !== null){ k = bestC; snapped = true; }

    let ia = 0, ic = SEGS.length - 1;
    for (let i = 0; i < SEGS.length; i++){ if (SEGS[i][0] < k) ia = i; else break; }
    for (let i = SEGS.length - 1; i >= 0; i--){ if (SEGS[i][1] > k){ ic = i; break; } }
    let A = SEGS[ia][0], C = SEGS[ic][1];
    if (A >= k - 0.4) A = 0;
    if (C <= k + 0.4) C = FILM;
    while (C - A < MINLEN && (ia > 0 || ic < SEGS.length - 1)){
      if (ia > 0 && (ic >= SEGS.length - 1 || (k - A) >= (C - k))) { ia--; A = SEGS[ia][0]; }
      else { ic++; C = SEGS[ic][1]; }
    }
    if (C - A < MINLEN){ A = Math.max(0, k - 4); C = Math.min(FILM, A + MINLEN); }
    if (C - A > MAXLEN){ if (k - A > C - k) A = C - MAXLEN; else C = A + MAXLEN; }
    A = Math.max(0, A); C = Math.min(FILM, C);
    return { A, C, B: k, delta: snapped ? k - rawB : 0 };
  }

  /* ================= 音频（真出声） ================= */
  function filmSample(t){
    const i = segAt(t);
    if (i < 0) return 0.004 * (Math.random() * 2 - 1);
    const s = SEGS[i];
    const att = Math.min(1, (t - s[0]) / 0.10), dec = Math.min(1, (s[1] - t) / 0.16);
    const syl = Math.abs(Math.sin(t * 27.3 + s[2] * 3.7)) * 0.72 + Math.abs(Math.sin(t * 9.1 + s[2])) * 0.28;
    const wob = 0.72 + 0.28 * Math.sin(t * 1.63 + s[2]);
    const amp = att * dec * (0.3 + 0.66 * syl) * wob;
    const f0 = 95 + s[2] * 7, ph = 2 * Math.PI * f0 * t;
    return amp * (0.55 * Math.sin(ph) + 0.28 * Math.sin(2 * ph + 1.3) + 0.12 * Math.sin(3 * ph + 0.4)) * 0.9;
  }
  function filmClip(from, to){
    const n = Math.max(1, Math.round((to - from) * SR));
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) out[i] = filmSample(from + i / SR);
    return out;
  }
  function narrSamples(text, seed){
    const rng = mulberry32(seed);
    const nch = Math.max(4, text.replace(/\s/g, '').length);
    const dur = Math.min(9, Math.max(1.6, nch * 0.19));
    const n = Math.floor(dur * SR);
    const f0 = 148 + rng() * 46;
    const sylR = 3.5 + rng() * 1.3, phrR = 0.5 + rng() * 0.3, j = rng() * 6;
    const out = new Float32Array(n), fade = Math.floor(0.03 * SR);
    for (let i = 0; i < n; i++){
      const t = i / SR;
      const syl = Math.pow(Math.abs(Math.sin(Math.PI * sylR * t + j)), 0.65);
      const phrase = 0.22 + 0.78 * Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * phrR * t + j), 1.6);
      const f = f0 * (1 + 0.04 * Math.sin(2 * Math.PI * 1.3 * t));
      const ph = 2 * Math.PI * f * t;
      let v = syl * phrase * (0.6 * Math.sin(ph) + 0.3 * Math.sin(2 * ph) + 0.1 * Math.sin(3 * ph)) * 0.5;
      if (i < fade) v *= i / fade;
      if (i > n - fade) v *= (n - i) / fade;
      out[i] = v;
    }
    return out;
  }
  function clickSm(){
    const n = Math.floor(0.055 * SR), out = new Float32Array(n);
    for (let i = 0; i < n; i++){
      const t = i / SR;
      const env = Math.exp(-t * 46);
      out[i] = env * (0.55 * Math.sin(2 * Math.PI * 1180 * t) + 0.3 * Math.sin(2 * Math.PI * 2360 * t));
    }
    return out;
  }
  function cat(list){
    let n = 0; for (const a of list) n += a.length;
    const out = new Float32Array(n); let o = 0;
    for (const a of list){ out.set(a, o); o += a.length; }
    return out;
  }
  function wavBlob(sm){
    const n = sm.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); wr(8, 'WAVEfmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, SR, true); dv.setUint32(28, SR * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    wr(36, 'data'); dv.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++){
      const v = Math.max(-1, Math.min(1, sm[i]));
      dv.setInt16(44 + i * 2, v * 32767, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  /* ---- 极简 zip（store，不压缩）：把选中的片段打包 ---- */
  function crc32(u8){
    let c, crc = 0xFFFFFFFF;
    for (let n = 0; n < u8.length; n++){
      c = (crc ^ u8[n]) & 0xff;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function zipBlob(files){
    const enc = new TextEncoder();
    const parts = [], central = [];
    let off = 0;
    for (const f of files){
      const name = enc.encode(f.name), data = new Uint8Array(f.bytes);
      const crc = crc32(data);
      const lh = new Uint8Array(30 + name.length);
      const dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true); dv.setUint16(26, name.length, true);
      dv.setUint16(28, 0, true);
      lh.set(name, 30);
      parts.push(lh, data);
      const ch = new Uint8Array(46 + name.length);
      const cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true); cv.setUint32(42, off, true);
      ch.set(name, 46);
      central.push(ch);
      off += lh.length + data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true); ev.setUint32(12, cdSize, true);
    ev.setUint32(16, off, true);
    return new Blob([...parts, ...central, end], { type: 'application/zip' });
  }

  /* ================= 状态 ================= */
  const P = { t: 42.6 };                 // 全局播放头
  let samples = [];                      // 第一层
  let uid = 0;
  const MINSPAN = () => MINLEN;

  function newSample(t){
    const d = derive(t);
    const ins = newInsert(d.B);
    return { id: ++uid, A: d.A, C: d.C, prev: d.B, prevDelta: d.delta,
             inserts: [ ins ], open: { k: 'ins', id: ins.id } };
  }
  function newInsert(t){
    return { id: ++uid, t, text: '', takes: [], sel: null, busy: false };
  }

  function minBT(s){ return s.inserts.length ? Math.min.apply(null, s.inserts.map(i => i.t)) : s.prev; }
  function maxBT(s){ return s.inserts.length ? Math.max.apply(null, s.inserts.map(i => i.t)) : s.prev; }
  /* 窗长仍是 8~15s（上限 15s 是 IndexTTS2 的硬限制：音色参考只吃前 15s）。
     但长度不该把端点钉死 —— 往外拖过头时另一端被顶着一起走，等于整窗平移：
     起点能一路推到片头，止点能一路推到片尾。真正挡住端点的只剩插入点 B。 */
  function legalA(s){ return [Math.max(0.05, maxBT(s) + 0.4 - MAXLEN), Math.min(s.C - MINLEN, minBT(s) - 0.4)]; }
  function legalC(s){ return [Math.max(s.A + MINLEN, maxBT(s) + 0.4), FILM - 0.05]; }

  /* moved 这一端刚写入，把另一端收敛回 8~15s；若被 B 挡住放不下，就回退自己 */
  function clampWin(s, moved){
    if (moved === 'A'){
      if (s.C - s.A > MAXLEN) s.C = s.A + MAXLEN;
      s.C = Math.max(s.C, Math.max(s.A + MINLEN, maxBT(s) + 0.4));
      if (s.C - s.A > MAXLEN) s.A = Math.max(0.05, s.C - MAXLEN);
    } else {
      if (s.C - s.A > MAXLEN) s.A = s.C - MAXLEN;
      s.A = Math.min(s.A, s.C - MINLEN);
    }
    s.A = Math.max(0.05, s.A);
    s.C = Math.min(FILM - 0.05, s.C);
  }
  function legalB(s, ins){
    let lo = s.A + 0.4, hi = s.C - 0.4;
    for (const o of s.inserts){
      if (o === ins) continue;
      if (Math.abs(o.t - ins.t) < 0.8){ if (o.t <= ins.t) lo = Math.max(lo, o.t + 0.8); else hi = Math.min(hi, o.t - 0.8); }
    }
    return [lo, hi];
  }

  /* ================= 播放 ================= */
  let curAudio = null, curOwner = null;   // curOwner: {kind,sid,bid} 用来画进度
  function playSm(sm, owner){
    if (curAudio){ curAudio.pause(); curAudio = null; }
    curAudio = new Audio(URL.createObjectURL(wavBlob(sm)));
    curAudio.play();
    curOwner = owner || null;
    if (owner) animate(owner, sm.length / SR);
    return curAudio;
  }
  function animate(owner, dur){
    const au = curAudio, t0 = performance.now();
    (function step(now){
      if (!curAudio || curAudio !== au){ prog = null; drawAll(); return; }
      prog = { owner, k: Math.min(1, (now - t0) / (dur * 1000)) };
      drawOne(owner);
      if (prog.k < 1) requestAnimationFrame(step);
      else { prog = null; drawAll(); }
    })(t0);
  }
  let prog = null;

  // 整段试听：原声走到每个 B 滴一声；该 B 若已选定版本，滴声后接那一版旁白
  function sliceSm(s){
    const parts = [];
    let cur = s.A;
    for (const ins of s.inserts.slice().sort((a, b) => a.t - b.t)){
      const t = Math.min(s.C, Math.max(s.A, ins.t));
      parts.push(filmClip(cur, t));
      parts.push(clickSm());
      const tk = ins.sel != null ? ins.takes.find(x => x.id === ins.sel) : null;
      if (tk) parts.push(narrSamples(ins.text, tk.seed));
      cur = t;
    }
    parts.push(filmClip(cur, s.C));
    return cat(parts);
  }
  function edgeSm(t, withClick){
    const a = filmClip(Math.max(0, t - 1.5), t);
    const b = filmClip(t, Math.min(FILM, t + 1.5));
    return cat(withClick ? [a, clickSm(), b] : [a, b]);
  }

  /* ================= 画图 ================= */
  const cssMap = {};
  function cssVar(n){
    if (cssMap[n]) return cssMap[n];
    cssMap[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#0a84ff';
    return cssMap[n];
  }
  const CN = '零一二三四五六七八九';
  function cnNum(n){
    if (n <= 0) return '零';
    if (n < 10) return CN[n];
    if (n === 10) return '十';
    if (n < 20) return '十' + CN[n - 10];
    if (n < 100) return CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
    return String(n);
  }
  function letter(n){
    let s = ''; n -= 1;
    do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
    return s;
  }
  function fmt(t){
    const m = Math.floor(t / 60), s = t - m * 60;
    return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
  }

  function prep(cv){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function drawWave(ctx, W, H, vs, ve){
    const mid = H / 2;
    for (let x = 0; x < W; x++){
      const t = vs + x / W * (ve - vs);
      const a = ampAt(t);
      const h = Math.max(0.5, a * (H - 8));
      ctx.fillStyle = cssVar('--bread');
      ctx.globalAlpha = 0.55;
      ctx.fillRect(x, mid - h / 2, 1, h);
    }
    ctx.globalAlpha = 1;
  }

  function drawOver(cv, s){
    const ctx = prep(cv), W = cv.clientWidth, H = cv.clientHeight, mid = H / 2;
    ctx.clearRect(0, 0, W, H);
    const vs = s.A, ve = s.C;
    const xOf = (t) => (t - vs) / (ve - vs) * W;
    ctx.fillStyle = cssVar('--muted');
    ctx.globalAlpha = 0.55;
    ctx.fillRect(0, Math.round(mid), W, 1);
    ctx.globalAlpha = 1;
    drawWave(ctx, W, H, vs, ve);

    // hover 跟随的灰线：跟着鼠标实时走，不落状态（点击不再落播放头）
    if (hover && hover.sid === s.id){
      const xh = Math.round(xOf(hover.t)) - 0.5;
      ctx.fillStyle = cssVar('--label2');
      ctx.fillRect(xh, 0, 1, H);
    }

    // 每个 B：就是一条竖线（选中实、未选淡），上下不挂任何三角
    for (const ins of s.inserts){
      const x = xOf(ins.t);
      const sel = ins.sel != null || (s.open && s.open.k === 'ins' && s.open.id === ins.id);
      const w = sel ? 1.6 : 1.2;
      ctx.fillStyle = cssVar('--accent');
      ctx.globalAlpha = sel ? 1 : 0.45;
      ctx.fillRect(x - w / 2, 0, w, H);
      ctx.globalAlpha = 1;
    }

    // 卡片内的预览播放头：同样只是一条线
    const xp = xOf(s.prev);
    ctx.fillStyle = cssVar('--label');
    ctx.fillRect(Math.round(xp) - 0.5, 0, 1, H);

    if (prog && prog.owner.kind === 'over' && prog.owner.sid === s.id){
      ctx.fillStyle = cssVar('--accent');
      ctx.fillRect(Math.round(prog.k * W), 0, 1.2, H);
    }
  }

  function drawEdge(cv, s, which){
    const ctx = prep(cv), W = cv.clientWidth, H = cv.clientHeight, mid = H / 2;
    ctx.clearRect(0, 0, W, H);
    const t0 = (which === 'A') ? s.A : s.C;
    const vs = t0 - 2.8, ve = t0 + 2.8;
    const xOf = (t) => (t - vs) / (ve - vs) * W;
    // 可动范围现在基本等于整条时间轴，铺一层淡蓝没有信息量，不画
    drawWave(ctx, W, H, vs, ve);
    // 窗内其它 B 的位置
    for (const ins of s.inserts){
      const x = xOf(ins.t);
      if (x > 2 && x < W - 2){
        ctx.fillStyle = cssVar('--accent'); ctx.globalAlpha = 0.4;
        ctx.fillRect(Math.round(x), 3, 1, H - 6); ctx.globalAlpha = 1;
      }
    }
    const x = xOf(t0);
    ctx.fillStyle = cssVar('--label');
    ctx.fillRect(Math.round(x) - 0.5, 0, 1, H);
    if (prog && prog.owner.kind === which && prog.owner.sid === s.id){
      ctx.fillStyle = cssVar('--accent');
      ctx.fillRect(Math.round(prog.k * W), 0, 1.2, H);
    }
  }

  function drawB(cv, s, ins){
    const ctx = prep(cv), W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    const vs = ins.t - 2.8, ve = ins.t + 2.8;
    const xOf = (t) => (t - vs) / (ve - vs) * W;
    if (drag && drag.kind === 'B' && drag.sid === s.id && drag.bid === ins.id){
      const b = legalB(s, ins);
      const x1 = xOf(b[0]), x2 = xOf(b[1]);
      ctx.fillStyle = cssVar('--accent'); ctx.globalAlpha = 0.1;
      ctx.fillRect(x1, 0, Math.max(0, x2 - x1), H); ctx.globalAlpha = 1;
    }
    drawWave(ctx, W, H, vs, ve);
    const x = xOf(ins.t);
    ctx.fillStyle = cssVar('--accent');
    ctx.fillRect(x - 0.8, 0, 1.6, H);
    if (prog && prog.owner.kind === 'B' && prog.owner.sid === s.id && prog.owner.bid === ins.id){
      ctx.fillStyle = cssVar('--accent');
      ctx.fillRect(Math.round(prog.k * W), 0, 1.2, H);
    }
  }

  // 第三次层里那一条：已生成的波形，兼作播放进度，不可拖
  function envOf(tk, W){
    if (tk._env && tk._envW === W) return tk._env;
    const sm = tk.sm, env = new Float32Array(W);
    const step = Math.max(1, Math.floor(sm.length / W));
    for (let x = 0; x < W; x++){
      let peak = 0;
      const a = x * step, b = Math.min(sm.length, a + step);
      for (let i = a; i < b; i++){ const v = sm[i] < 0 ? -sm[i] : sm[i]; if (v > peak) peak = v; }
      env[x] = peak;
    }
    tk._env = env; tk._envW = W;
    return env;
  }
  function drawTake(cv, tk){
    const ctx = prep(cv), W = cv.clientWidth, H = cv.clientHeight, mid = H / 2;
    ctx.clearRect(0, 0, W, H);
    if (!tk.sm){ ctx.fillStyle = cssVar('--muted'); ctx.fillRect(0, mid - 0.5, W, 1); return; }
    const env = envOf(tk, W);
    const on = prog && prog.owner.kind === 'take' && prog.owner.tkid === tk.id;
    const k = on ? prog.k : 0;
    const bread = cssVar('--bread'), accent = cssVar('--accent');
    for (let x = 0; x < W; x++){
      const h = Math.max(0.6, Math.min(1, env[x] * 1.4) * (H - 6));
      const played = k > 0 && x <= k * W;
      ctx.fillStyle = played ? accent : bread;
      ctx.globalAlpha = played ? 0.9 : 0.5;
      ctx.fillRect(x, mid - h / 2, 1, h);
    }
    ctx.globalAlpha = 1;
    if (k > 0){
      ctx.fillStyle = accent;
      ctx.fillRect(Math.round(k * W) - 0.5, 0, 1.2, H);
    }
  }

  let drag = null;
  /* 鼠标在片段轴上 hover 的位置：只是一条灰线 + 轴下方的小气泡加号，不落任何状态 */
  let hover = null;
  function drawOne(owner){
    const s = samples.find(x => x.id === owner.sid);
    if (!s) return;
    if (owner.kind === 'over') eachCv(owner, (cv) => drawOver(cv, s));
    else if (owner.kind === 'A' || owner.kind === 'C') eachCv(owner, (cv) => drawEdge(cv, s, owner.kind));
    else if (owner.kind === 'B'){
      const ins = s.inserts.find(i => i.id === owner.bid);
      if (ins) eachCv(owner, (cv) => drawB(cv, s, ins));
    }
    else if (owner.kind === 'take'){
      for (const ins of s.inserts){
        const tk = ins.takes.find(x => x.id === owner.tkid);
        if (tk){ eachCv(owner, (cv) => drawTake(cv, tk)); break; }
      }
    }
  }
  function eachCv(owner, fn){
    document.querySelectorAll('canvas.cv').forEach((cv) => {
      if (cv.dataset.kind !== owner.kind) return;
      if (+cv.dataset.sid !== owner.sid) return;
      if (owner.bid != null && +cv.dataset.bid !== owner.bid) return;
      if (owner.tkid != null && +cv.dataset.tkid !== owner.tkid) return;
      fn(cv);
    });
  }
  function drawAll(){
    document.querySelectorAll('canvas.cv').forEach((cv) => {
      const sid = +cv.dataset.sid;
      const s = samples.find(x => x.id === sid);
      if (!s) return;
      if (cv.dataset.kind === 'over') drawOver(cv, s);
      else if (cv.dataset.kind === 'A' || cv.dataset.kind === 'C') drawEdge(cv, s, cv.dataset.kind);
      else if (cv.dataset.kind === 'take'){
        for (const ins of s.inserts){
          const tk = ins.takes.find(x => x.id === +cv.dataset.tkid);
          if (tk){ drawTake(cv, tk); break; }
        }
      }
      else {
        const ins = s.inserts.find(i => i.id === +cv.dataset.bid);
        if (ins) drawB(cv, s, ins);
      }
    });
  }

  /* ================= 渲染 ================= */
  const cardsHost = document.getElementById('cards');
  const SVG_PLAY = '<svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg>';
  const SVG_PLUS = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"' +
    ' stroke-linecap="round"><path d="M5 1.4v7.2M1.4 5h7.2"/></svg>';

  function render(){
    cardsHost.innerHTML = '';
    samples.forEach((s, i) => cardsHost.appendChild(cardEl(s, i)));
    samples.forEach((s) => {                       // 入 DOM 后波形才有宽度，此时再定尾巴
      const el = document.querySelector('.card[data-sid="' + s.id + '"]');
      if (el) paintDots(el, s);
    });
    updateFoot();
    drawAll();
  }

  function cardEl(s, i){
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.sid = s.id;
    el.innerHTML =
      '<div class="cardhd"><span class="idx">取样片段 ' + cnNum(i + 1) + '</span>' +
      '<div class="meta"><span class="span"></span><span class="prev"></span></div>' +
      '<button class="del" data-act="delCard" title="删除此片段">✕</button></div>' +
      '<div class="collapse" data-row="topaxis"></div>' +
      '<div class="dotsrow" data-row="top">' +
        '<button class="dotbtn tl" data-act="dotA" title="调整起点"><i></i><b></b></button>' +
        '<button class="dotbtn tr" data-act="dotC" title="调整止点"><i></i><b></b></button>' +
      '</div>' +
      '<div class="hoverzone">' +
        '<div class="axis"><button class="play" data-act="playOver" title="试听整段">' + SVG_PLAY + '</button>' +
        '<canvas class="cv over" data-kind="over" data-sid="' + s.id + '"></canvas></div>' +
        '<div class="idots" data-row="idots">' +
          '<button class="plus" data-act="addAt" title="在这里新增插入点">' + SVG_PLUS + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="collapse" data-row="insHost"></div>';

    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'delCard'){ samples = samples.filter(x => x !== s); render(); }
      else if (act === 'playOver') playSm(sliceSm(s), { kind: 'over', sid: s.id });
      else if (act === 'playA') playSm(edgeSm(s.A, true), { kind: 'A', sid: s.id });
      else if (act === 'playC') playSm(edgeSm(s.C, true), { kind: 'C', sid: s.id });
      else if (act === 'dotA') toggle(s, { k: 'A' });
      else if (act === 'dotC') toggle(s, { k: 'C' });
      else if (act === 'addAt') addIns(s, hover && hover.sid === s.id ? hover.t : null);
    });

    el.querySelector('[data-row="idots"]').addEventListener('click', (e) => {
      const b = e.target.closest('.idot');
      if (!b) return;
      toggle(s, { k: 'ins', id: +b.dataset.id });
    });

    bindCanvas(el.querySelector('canvas.over'), 'over', s, null);

    applyOpen(el, s);
    updateCardMeta(el, s);
    return el;
  }

  /* 展开态：一次只展开一个轴；圆点是入口，始终可见，不受对方展开影响 */
  function toggle(s, next){
    const cur = s.open;
    const same = cur && cur.k === next.k && (next.id == null || cur.id === next.id);
    s.open = same ? null : next;
    const el = document.querySelector('.card[data-sid="' + s.id + '"]');
    if (el){ applyOpen(el, s); drawAll(); }
  }

  function addIns(s, at){
    const t = Math.max(s.A + 0.4, Math.min(s.C - 0.4, at == null ? s.prev : at));
    const ins = newInsert(t);
    s.inserts.push(ins);
    s.open = { k: 'ins', id: ins.id };
    render();
  }

  function applyOpen(el, s){
    const openIns = !!(s.open && s.open.k === 'ins');
    const top = el.querySelector('[data-row="top"]');
    top.querySelector('[data-act="dotA"]').dataset.on = (s.open && s.open.k === 'A') ? '1' : '0';
    top.querySelector('[data-act="dotC"]').dataset.on = (s.open && s.open.k === 'C') ? '1' : '0';

    const ax = el.querySelector('[data-row="topaxis"]');
    const which = (s.open && (s.open.k === 'A' || s.open.k === 'C')) ? s.open.k : null;
    if (which){
      if (ax.dataset.k !== which){
        const prevK = ax.dataset.k;
        ax.dataset.k = which;
        const html =
          '<div><div class="edgecard" data-k="' + which + '">' +
            '<div class="inshd"><span class="idx">' + (which === 'A' ? '起点' : '止点') + '</span>' +
            '<span class="tc"></span></div>' +
            '<div class="axis"><span class="lab">' + (which === 'A' ? '起' : '止') + '</span>' +
            '<button class="play" data-act="play' + which + '" title="试听">' + SVG_PLAY + '</button>' +
            '<canvas class="cv edge" data-kind="' + which + '" data-sid="' + s.id + '"></canvas></div>' +
          '</div></div>';
        const d = prevK ? swapDir(s, prevK, which) : null;
        const build = () => {
          if (ax.dataset.k !== which) return;        // 期间又切走了，作废
          ax.innerHTML = html;
          const card = ax.querySelector('.edgecard');
          if (card && d) slideIn(card, d.in);
          bindCanvas(ax.querySelector('canvas'), which, s, null);
          paintDots(el, s);
          updateCardMeta(el, s);
        };
        const old = prevK ? ax.querySelector('.edgecard') : null;
        if (old) slideOut(old, d.out, build); else build();
      }
      setCollapse(ax, true);
    } else {
      setCollapse(ax, false);        // 内容留着，让它自己收起来
    }

    paintDots(el, s);

    const host = el.querySelector('[data-row="insHost"]');
    if (openIns){
      const j = s.inserts.findIndex(x => x.id === s.open.id);
      if (j >= 0){
        const ins = s.inserts[j], want = String(ins.id);
        const d = host.dataset.ins ? swapDir(s, host.dataset.ins, want) : null;
        const build = () => {
          if (!(s.open && s.open.k === 'ins' && String(s.open.id) === want)) return;
          host.innerHTML = '';
          const wrap = document.createElement('div');
          wrap.appendChild(insEl(s, ins, j));
          host.appendChild(wrap);
          const card = host.querySelector('.ins');
          if (card && d) slideIn(card, d.in);
          host.dataset.ins = want;
          paintDots(el, s);
        };
        const old = (host.dataset.ins && host.dataset.ins !== want) ? host.querySelector('.ins') : null;
        if (old) slideOut(old, d.out, build); else build();
      }
      setCollapse(host, true);
    } else {
      setCollapse(host, false);
    }
    updateCardMeta(el, s);   // 白卡刚建出来时把时间填上
  }

  /* 换卡动效：方向只看两个圆点的相对位置 —— 新圆点在旧圆点右边，旧卡向左退、新卡从右进。
     只有「已有一张、换成另一张」才走这套；从折叠到展开靠高度动画，不叠水平位移。
     （按绝对左右半边算是错的：两个插入点同在左半边时，切换就分不出方向。） */
  function dotX(s, k){
    if (k === 'A') return 0;
    if (k === 'C') return 1;
    const ins = s.inserts.find(x => String(x.id) === String(k));
    return ins ? (ins.t - s.A) / Math.max(0.001, s.C - s.A) : 0.5;
  }
  function swapDir(s, oldK, newK){
    const right = dotX(s, newK) > dotX(s, oldK);
    return { in: right ? 'r' : 'l', out: right ? 'l' : 'r' };
  }
  function slideOut(card, dir, done){
    const col = card.closest('.collapse');
    if (col) unclip(col, 0);           // 滑动也画在裁切层外，圆角不能被边界切一刀
    card.style.setProperty('--sx', dir === 'l' ? '-12px' : '12px');
    card.classList.add('swap-out');
    setTimeout(done, 130);
  }
  function slideIn(card, dir){
    card.style.setProperty('--sx', dir === 'l' ? '-12px' : '12px');
    card.classList.add('swap-in');
    void card.offsetHeight;              // 让初值当场生效，再移除让它滑回来
    card.classList.remove('swap-in');
  }

  /* 裁切层的 overflow：展开动画期间必须裁（内容会从 0 长出来），稳定后放开，
     白卡的阴影和换卡滑动才画得出去；收起时立刻收回。 */
  function unclip(el, ms){
    clearTimeout(el._uc);
    const go = () => { if (el.dataset.open === '1') el.classList.add('vis'); };
    if (ms) el._uc = setTimeout(go, ms); else go();
  }
  function clip(el){
    clearTimeout(el._uc);
    el.classList.remove('vis');
  }

  /* 整卡重建（render）时不动画，只有真正的展开/折叠才动 */
  function setCollapse(el, open){
    const fresh = el.dataset.init !== '1';
    el.dataset.init = '1';
    if (fresh) el.classList.add('noanim');
    el.dataset.open = open ? '1' : '0';
    if (fresh){
      void el.offsetHeight;        // 强制回流，让 0fr/1fr 的初值当场生效
      el.classList.remove('noanim');
    }
    if (open) unclip(el, fresh ? 0 : 220);   // 高度动画走完再放开
    else clip(el);
  }

  /* 气泡尾巴：底边 18px 贴着卡片，容器 25px（多出的一个圆角 7px 给尖端伸出去）。
     底边整条必须落在白卡的「直边段」里（白卡左右各有 --rsm 7px 的圆角，底边压上去
     圆角处就会露出灰底的空白），所以夹取只约束底边；尖端不受约束，永远精确落在该点。
     于是起点/止点即使贴在波形两端，也是正常斜三角，不再是贴着边的直角形状。 */
  const LEAD = 28, TAIL = 18, CORNER = 7, TAILBOX = TAIL + CORNER;
  function setTip(btn, k, W){
    if (!btn) return;
    const x = k * W;
    const lo = -(LEAD - CORNER);          // 白卡向左伸到 -28，圆角吃掉 7
    const hi = W - TAILBOX;               // 右边没富余，底边右端必须让开圆角
    const L = Math.max(lo, Math.min(hi, x - TAIL / 2));
    btn.style.left = L + 'px';
    btn.style.setProperty('--tip', ((x - L) / TAILBOX * 100).toFixed(2) + '%');
  }

  function paintDots(el, s){
    const host = el.querySelector('[data-row="idots"]');
    if (!host) return;
    const cv = el.querySelector('canvas.over');
    const W = cv ? cv.clientWidth : 0;
    host.querySelectorAll('.idot').forEach((n) => n.remove());   // 加号气泡是常驻的，别一起清掉
    const openId = (s.open && s.open.k === 'ins') ? s.open.id : null;
    s.inserts.forEach((ins, j) => {
      const b = document.createElement('button');
      b.className = 'idot dotbtn';
      b.dataset.id = ins.id;
      b.dataset.on = ins.id === openId ? '1' : '0';
      b.title = '插入 ' + letter(j + 1) + ' · ' + fmt(ins.t);
      b.innerHTML = '<i></i><b></b>';
      host.appendChild(b);
      setTip(b, Math.max(0, Math.min(1, (ins.t - s.A) / (s.C - s.A))), W);
    });
    setTip(el.querySelector('[data-act="dotA"]'), 0, W);
    setTip(el.querySelector('[data-act="dotC"]'), 1, W);
    paintPlus(el, s);
  }

  /* 加号气泡：跟着 hover 的灰线走；落在已有圆点附近时让位，免得两个圆圈打架。
     左右夹在 [-8, W-8]，圆心永远对准灰线（跟尾巴尖端一个道理：位置让给精度）。 */
  function paintPlus(el, s){
    const p = el.querySelector('.plus');
    if (!p) return;
    const cv = el.querySelector('canvas.over');
    const W = cv ? cv.clientWidth : 0;
    const on = !!(hover && hover.sid === s.id);
    p.dataset.on = '0';
    if (!on) return;
    const kOf = (t) => (t - s.A) / Math.max(0.001, s.C - s.A) * W;
    const x = kOf(hover.t);
    for (const ins of s.inserts){ if (Math.abs(kOf(ins.t) - x) < 13) return; }
    p.style.left = Math.max(-8, Math.min(W - 8, x - 8)) + 'px';
    p.dataset.on = '1';
  }

  function updateCardMeta(el, s){
    el.querySelector('.span').textContent = (s.C - s.A).toFixed(1) + 's';
    el.querySelector('.prev').textContent = '播放头 ' + fmt(s.prev);
    const ec = el.querySelector('.edgecard');
    if (ec){
      const tc = ec.querySelector('.tc');
      if (tc) tc.textContent = fmt(ec.dataset.k === 'A' ? s.A : s.C);
    }
  }

  function insEl(s, ins, j){
    const el = document.createElement('div');
    el.className = 'ins';
    el.innerHTML =
      '<div class="inshd"><span class="idx">插入 ' + letter(j + 1) + '</span>' +
      '<span class="tc">' + fmt(ins.t) + '</span>' +
      '<button class="del" data-act="delIns" title="删除此插入点">✕</button></div>' +
      '<div class="axis"><span class="lab wide">插入点</span><button class="play" data-act="playB">' + SVG_PLAY + '</button>' +
      '<canvas class="cv edge" data-kind="B" data-sid="' + s.id + '" data-bid="' + ins.id + '"></canvas></div>' +
      '<textarea rows="2" placeholder="补哪一句？"></textarea>' +
      '<div class="insacts"><span class="spacer"></span><button class="btn primary" data-act="gen">生成</button></div>' +
      '<div class="takes"></div>';

    const ta = el.querySelector('textarea');
    ta.value = ins.text;
    ta.addEventListener('input', () => {
      ins.text = ta.value.trim();
      el.querySelector('[data-act="gen"]').disabled = !ins.text || ins.busy;
    });

    el.querySelectorAll('[data-act]').forEach((b) => {
      b.addEventListener('click', () => {
        const act = b.dataset.act;
        if (act === 'delIns'){
          s.inserts = s.inserts.filter(x => x !== ins);
          if (s.open && s.open.id === ins.id) s.open = null;
          render();
        }
        else if (act === 'playB') playSm(edgeSm(ins.t, true), { kind: 'B', sid: s.id, bid: ins.id });
        else if (act === 'gen') gen(s, ins);
      });
    });

    bindCanvas(el.querySelector('canvas[data-kind="B"]'), 'B', s, ins);
    paintTakes(el.querySelector('.takes'), s, ins);
    el.querySelector('[data-act="gen"]').disabled = !ins.text || ins.busy;
    return el;
  }

  function paintTakes(host, s, ins){
    host.innerHTML = '';
    ins.takes.forEach((tk) => {
      const row = document.createElement('div');
      row.className = 'take';
      row.dataset.tkid = tk.id;
      if (tk.pending){
        const pct = Math.round((tk.p || 0) * 100);
        row.innerHTML =
          '<span class="k">第 ' + tk.n + ' 次</span>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<span class="pct">' + pct + '%</span>';
        host.appendChild(row);
        return;
      }
      const sel = ins.sel === tk.id;
      row.dataset.sel = sel ? '1' : '0';
      row.innerHTML =
        '<span class="k">第 ' + tk.n + ' 次</span>' +
        '<button class="play" title="试听">' + SVG_PLAY + '</button>' +
        '<canvas class="cv take" data-kind="take" data-sid="' + s.id + '" data-bid="' + ins.id +
          '" data-tkid="' + tk.id + '"></canvas>' +
        '<button class="pick">' + (sel ? '已选中' : '选中') + '</button>' +
        '<button class="drop">丢弃</button>';
      row.querySelector('.play').addEventListener('click', () => {
        playSm(tk.sm || narrSamples(ins.text, tk.seed), { kind: 'take', sid: s.id, bid: ins.id, tkid: tk.id });
      });
      row.querySelector('.pick').addEventListener('click', () => {
        ins.sel = ins.sel === tk.id ? null : tk.id;
        render();
      });
      row.querySelector('.drop').addEventListener('click', () => {
        ins.takes = ins.takes.filter(x => x !== tk);
        if (ins.sel === tk.id) ins.sel = null;
        render();
      });
      host.appendChild(row);
    });
  }

  function gen(s, ins){
    if (!ins.text || ins.busy) return;
    ins.busy = true;
    ins.count = (ins.count || 0) + 1;
    const tk = { id: ++uid, n: ins.count, seed: (Date.now() & 0xffff) ^ (ins.count * 7919),
                 pending: true, p: 0, sm: null };
    ins.takes.push(tk);
    render();
    const iv = setInterval(() => {
      tk.p = Math.min(1, tk.p + 0.07 + Math.random() * 0.09);
      const row = document.querySelector('.take[data-tkid="' + tk.id + '"]');
      if (row){
        const bar = row.querySelector('.bar i'), pct = row.querySelector('.pct');
        if (bar) bar.style.width = Math.round(tk.p * 100) + '%';
        if (pct) pct.textContent = Math.round(tk.p * 100) + '%';
      }
      if (tk.p >= 1){
        clearInterval(iv);
        tk.pending = false; tk.p = 1;
        tk.sm = narrSamples(ins.text, tk.seed);
        ins.sel = tk.id;
        ins.busy = false;
        render();
        updateFoot();
        setTimeout(() => playSm(tk.sm, { kind: 'take', sid: s.id, bid: ins.id, tkid: tk.id }), 60);
      }
    }, 90);
  }

  /* ================= 画布交互 ================= */
  function bindCanvas(cv, kind, s, ins){
    let px = null;
    cv.addEventListener('pointerdown', (e) => {
      if (kind === 'over') return;              // 概览轴只是 hover 预览，不抓指针
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      px = e.clientX;
      drag = { kind, sid: s.id, bid: ins ? ins.id : null };
      if (kind === 'B') drag.raw = ins.t;
      drawAll();
    });
    /* 概览轴的 hover 区 = 波形行 + 圆点行（加号气泡在这两行里）。
       只监听 canvas 的话，鼠标一往下走就 leave，加号还没点到就消失了。 */
    const zone = kind === 'over' ? (cv.closest('.hoverzone') || cv) : cv;
    zone.addEventListener('pointermove', (e) => {
      if (kind === 'over'){
        const r = cv.getBoundingClientRect();
        // 落在波形横向范围之外（比如左侧的试听按钮）就不显示，免得灰线卡在一端
        if (e.clientX < r.left || e.clientX > r.right){ hoverOff(cv, s); return; }
        const k = Math.max(0, Math.min(1, (e.clientX - r.left) / cv.clientWidth));
        hover = { sid: s.id, t: s.A + k * (s.C - s.A) };
        drawOver(cv, s);
        paintPlus(cv.closest('.card'), s);
        return;
      }
      if (px == null) return;
      const W = cv.clientWidth;
      const dt = (e.clientX - px) / W * 5.6;
      px = e.clientX;
      if (Math.abs(dt) < 1e-4) return;
      const b = kind === 'A' ? legalA(s) : kind === 'C' ? legalC(s) : legalB(s, ins);
      let nt = s[kind];
      if (kind === 'B') nt = ins.t;
      // 视图以该点为心，波形要 1:1 跟手：手往右，画面往右，等于窗口往时间轴反方向走
      nt = Math.max(b[0], Math.min(b[1], nt - dt));
      if (kind === 'B'){
        const raw = Math.max(b[0], Math.min(b[1],
          ((drag && drag.raw != null) ? drag.raw : ins.t) - dt));
        if (drag) drag.raw = raw;
        let bd = DRAG_MAGNET, bc = null;
        for (const g of GAPS){
          const c = (g[0] + g[1]) / 2, d = Math.abs(c - raw);
          if (d < bd){ bd = d; bc = c; }
        }
        nt = (bc !== null && bc >= b[0] && bc <= b[1]) ? bc : raw;
        ins.t = nt;
        const hd = cv.closest('.ins');
        if (hd){ const tc = hd.querySelector('.tc'); if (tc) tc.textContent = fmt(ins.t); }
      } else {
        s[kind] = nt;
        clampWin(s, kind);                 // 拖过头就把另一端顶着走，等于整窗平移
        // 边界推进时，允许把 B 顶开（保证 A < B < C）
        for (const o of s.inserts){
          o.t = Math.max(s.A + 0.4, Math.min(s.C - 0.4, o.t));
        }
      }
      drawAll();
      const card = cv.closest('.card');
      if (card){ updateCardMeta(card, s); paintDots(card, s); }
    });
    const up = () => { px = null; if (drag){ drag = null; drawAll(); } };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    if (kind === 'over'){
      zone.addEventListener('pointerleave', () => hoverOff(cv, s));
    }
  }

  function hoverOff(cv, s){
    if (hover && hover.sid === s.id) hover = null;
    drawOver(cv, s);
    paintPlus(cv.closest('.card'), s);
  }
  /* ================= 全局播放头（真机由 IINA 提供） ================= */
  const track = document.getElementById('track');
  const trackph = document.getElementById('trackph');
  const trackfill = document.getElementById('trackfill');
  const tcEl = document.getElementById('tc');
  function setPlayhead(t){
    P.t = Math.max(0, Math.min(FILM, t));
    const pct = P.t / FILM * 100;
    trackph.style.left = pct + '%';
    trackfill.style.width = pct + '%';
    tcEl.textContent = fmt(P.t);
  }
  let td = false;
  track.addEventListener('pointerdown', (e) => { td = true; try{track.setPointerCapture(e.pointerId);}catch(_){} setPlayhead(x2t(e.clientX)); });
  track.addEventListener('pointermove', (e) => { if (td) setPlayhead(x2t(e.clientX)); });
  track.addEventListener('pointerup', () => { td = false; });
  function x2t(cx){ const r = track.getBoundingClientRect(); return (cx - r.left) / r.width * FILM; }

  /* ================= 底部两个出口 ================= */
  function selected(){
    const out = [];
    samples.forEach((s, i) => s.inserts.forEach((ins, j) => {
      const tk = ins.sel != null ? ins.takes.find(x => x.id === ins.sel) : null;
      if (tk) out.push({ s, i, ins, j, tk });
    }));
    return out;
  }
  function updateFoot(){
    const n = selected().length;
    document.getElementById('dlAll').disabled = n === 0;
    document.getElementById('insAll').disabled = n === 0;
    document.getElementById('dlAll').textContent = n ? '下载所有片段 · ' + n : '下载所有片段';
  }

  document.getElementById('addSample').addEventListener('click', () => {
    samples.push(newSample(P.t));
    render();
  });

  document.getElementById('dlAll').addEventListener('click', async () => {
    const sel = selected();
    if (!sel.length) return;
    const files = [];
    for (const it of sel){
      const sm = it.tk.sm || narrSamples(it.ins.text, it.tk.seed);
      const buf = await wavBlob(sm).arrayBuffer();
      files.push({ name: '取样' + cnNum(it.i + 1) + '_插入' + letter(it.j + 1) + '_第' + it.tk.n + '次.wav',
                   bytes: buf });
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob(files));
    a.download = '两面包夹芝士_选中片段.zip';
    a.click();
  });

  document.getElementById('insAll').addEventListener('click', () => {
    const n = selected().length;
    alert('原型：把 ' + n + ' 段按各自 B 的位置插回原片，生成整条并已在访达中显示。');
  });

  /* ================= 启动 ================= */
  window.addEventListener('resize', () => {          // 宽度变了，尾巴位置要重算
    samples.forEach((s) => {
      const el = document.querySelector('.card[data-sid="' + s.id + '"]');
      if (el) paintDots(el, s);
    });
    drawAll();
  });
  setPlayhead(42.6);
  samples.push(newSample(P.t));
  render();
})();
</script>
</body>
</html>
