<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两面包夹芝士</title>
<style>
  :root {
    --bg: #fbfaf8;
    --surface: #f2efe9;
    --surface2: #e7e3da;
    --border: rgba(60, 60, 67, 0.14);
    --text: #1d1b18;
    --text2: #6b655c;
    --muted: #9a948a;
    --brand: #cf9413;
    --bread: #8a6a3d;
    --ink: #241d16;
    --onInk: #fdfbf7;
    --ok: #2f8f6b;
    --bad: #bd4b3c;
    --r: 9px;
    --rsm: 6px;
    --g: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191714;
      --surface: #232019;
      --surface2: #2c281f;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f2ece1;
      --text2: #a8a196;
      --muted: #7d776d;
      --brand: #e6b155;
      --bread: #c2a276;
      --ink: #e6b155;
      --onInk: #241a0c;
      --ok: #4dbf95;
      --bad: #e58072;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 14px 14px 16px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
  }

  /* 顶部是上下文，不是功能：文件名、时间码、服务是否在线 */
  .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: var(--g); }
  .brand { display: flex; align-items: center; gap: 6px; flex: none; }
  .brandName { font-size: 13px; font-weight: 500; letter-spacing: .01em; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
  .ctx { margin-left: auto; text-align: right; min-width: 0; }
  .ctx .file {
    display: block; font-size: 11px; color: var(--muted);
    max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctx .clock {
    font: 500 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text2);
  }

  /* 组：四步。组间距远大于组内间距，眼睛自然读出「先做哪一步」 */
  .grp + .grp { margin-top: var(--g); }
  .grpHead { display: flex; align-items: baseline; gap: 7px; margin-bottom: 8px; }
  .step {
    font: 500 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); letter-spacing: .06em; padding-top: 2px;
  }
  .grpTitle { font-size: 13px; font-weight: 500; }
  .grpHead .spacer { flex: 1; }

  /* 参考条：这条常驻。没打点时它是空骨架 —— 它本身就是说明书，
     告诉用户「要在原声上取一段」，而不是等两个数齐了才冒出来。 */
  .refwrap { margin-bottom: 9px; }
  .refbar {
    position: relative; height: 34px; border-radius: var(--rsm);
    background: var(--surface); overflow: hidden; cursor: pointer;
  }
  .refbar.empty { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
  .refbar .fill { position: absolute; top: 0; bottom: 0; background: var(--bread); opacity: .22; }
  .refbar .edge { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bread); }
  .refbar .rb { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--brand); }
  .refbar .rhead { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--text); }
  .refbar .rhead::before {
    content: ""; position: absolute; top: 0; left: -2px;
    border: 3px solid transparent; border-top-color: var(--text);
  }
  .refbar .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted);
  }
  .refbar.on { box-shadow: inset 0 0 0 1.5px var(--brand); }
  .refmeta {
    display: flex; justify-content: space-between; gap: 8px;
    font: 500 10px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted);
  }

  /* 一张卡一个时间点：标签、值、两个操作都在同一张卡里。
     A/C 用的是同一套结构，B 也是 —— 只是 B 住在第四步。 */
  .card { background: var(--surface); border-radius: var(--rsm); padding: 7px 8px 6px; }
  .card + .card { margin-top: 6px; }
  .cardTop { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .role {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font: 500 10px/1 ui-monospace, Menlo, monospace; color: #fff;
  }
  [data-role="A"] .role, [data-role="C"] .role { background: var(--bread); }
  [data-role="B"] .role { background: var(--brand); }
  .card .cv {
    font: 500 13px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text);
  }
  .card .cv.unset { color: var(--muted); font-weight: 400; }
  .chip {
    border: 1px solid var(--border); background: var(--bg); color: var(--text2);
    border-radius: 5px; padding: 1px 7px; font-size: 11px; cursor: pointer;
    line-height: 18px; height: 20px;
  }
  .chip:hover { color: var(--text); border-color: var(--text2); }
  .chip.icon { padding: 1px 6px; min-width: 24px; }
  .chip.on { color: var(--brand); border-color: var(--brand); }
  .card canvas {
    display: block; width: 100%; height: 40px; border-radius: 5px;
    background: var(--bg); cursor: ew-resize; touch-action: none;
  }

  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--rsm);
    background: var(--surface); color: var(--text2); padding: 6px 10px;
  }
  button:hover { color: var(--text); }
  button:active { opacity: .65; }
  button[disabled] { opacity: .45; cursor: default; }
  button[disabled]:hover { color: var(--text2); }
  button.link {
    border: none; background: none; padding: 2px 0; font-size: 11px;
    color: var(--muted); text-decoration: underline; text-underline-offset: 2px;
  }
  button.link:hover { color: var(--text); }
  button.wide { display: block; width: 100%; }

  /* 唯一的重色块。旁边不再有同宽的对手，它就是这一屏的目的地 */
  button.primary {
    position: relative; width: 100%; border: none; padding: 10px;
    background: var(--ink); color: var(--onInk); font-size: 13px; font-weight: 500;
    border-radius: var(--r); overflow: hidden;
  }
  button.primary:hover { color: var(--onInk); }
  button.primary .pfill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: var(--brand); opacity: .32; transition: width .3s linear;
  }
  button.primary .ptxt { position: relative; }
  button.primary[disabled] { opacity: .4; }

  .why { font-size: 11px; color: var(--muted); margin-top: 5px; }

  textarea {
    display: block; width: 100%; min-height: 92px; resize: vertical;
    background: var(--surface); color: var(--text); font: inherit; line-height: 1.6;
    border: 1px solid var(--border); border-radius: var(--rsm);
    padding: 8px 9px; outline: none; -webkit-user-select: text;
  }
  textarea:focus { border-color: var(--brand); }

  .slider { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--muted); }
  .slider input[type=range] { flex: 1; accent-color: var(--brand); min-width: 0; }
  .slider .v { font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text2); min-width: 40px; text-align: right; }

  /* 第三步：旁白自己的播放器。这一段是面板里唯一由网页直接播的音频 */
  .player { display: flex; align-items: center; gap: 9px; }
  .playBig {
    width: 32px; height: 32px; padding: 0; flex: none; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12px; line-height: 1;
  }
  .playBig.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .ptrack { flex: 1; height: 4px; border-radius: 2px; background: var(--surface2); cursor: pointer; position: relative; }
  .ptrack .pfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--brand); border-radius: 2px; }
  .ptime { font: 500 11px/1 ui-monospace, Menlo, monospace; color: var(--text2); min-width: 62px; text-align: right; }

  /* 质检：合成完就该立刻看见「像不像」，不用去日志里翻 */
  .qc { margin-top: 9px; background: var(--surface); border-radius: var(--rsm); padding: 8px 10px; }
  .qcRow { display: flex; align-items: baseline; gap: 8px; }
  .qcRow .lb { font-size: 11px; color: var(--muted); }
  .qcSim { font: 500 15px/1 ui-monospace, Menlo, monospace; }
  .qcSim.good { color: var(--ok); }
  .qcSim.mid { color: var(--bread); }
  .qcSim.low { color: var(--bad); }
  .qcRow .cnt { margin-left: auto; font-size: 11px; color: var(--muted); }
  .qc details { margin-top: 6px; }
  .qc summary { font-size: 11px; color: var(--muted); cursor: pointer; }
  .qc summary:hover { color: var(--text); }
  .asr { margin-top: 5px; font-size: 11px; line-height: 1.6; color: var(--text2); -webkit-user-select: text; }

  /* 第四步：两个出口，一个拿到外面去，一个就地拼好 */
  .exit { background: var(--surface); border-radius: var(--rsm); padding: 9px 10px; }
  .exit + .exit { margin-top: 6px; }
  .exitHead { font-size: 12px; font-weight: 500; }
  .exitName {
    font: 500 12px/1.5 ui-monospace, Menlo, monospace; margin-top: 2px;
    word-break: break-all; color: var(--text);
  }
  .exitRow { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .exitRow button { padding: 4px 9px; font-size: 11px; }
  .exitRow .mut { font-size: 10px; color: var(--muted); }
  .stitch { margin-top: 8px; }

  .status {
    margin-top: var(--g); font-size: 11px; color: var(--muted);
    min-height: 16px;
  }
  .status.err { color: var(--bad); }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="dot off" id="dot"></span><span class="brandName">两面包夹芝士</span></div>
    <div class="ctx">
      <span class="file" id="file">未在播放</span>
      <span class="clock"><span id="pos">--:--</span> / <span id="dur">--:--</span></span>
    </div>
  </div>

  <!-- 01 取样：告诉它照着哪一段说话。这一步只需要 A 和 C，没有 B 的位置。 -->
  <section class="grp">
    <div class="grpHead">
      <span class="step">01</span><span class="grpTitle">照着哪一段说</span>
      <span class="spacer"></span>
      <button class="link" id="btnReset">清空</button>
    </div>

    <div class="refwrap">
      <div class="refbar empty" id="refbar" title="点一下跳到该处">
        <div class="fill" id="refFill" style="display:none"></div>
        <div class="edge" id="refEdgeA" style="display:none"></div>
        <div class="edge" id="refEdgeC" style="display:none"></div>
        <div class="rb" id="rbB" style="display:none"></div>
        <div class="rhead" id="rhead" style="display:none"></div>
        <div class="empty" id="refEmpty">在原声上取一段当样本</div>
      </div>
      <div class="refmeta"><span id="rbA">A 未打点</span><span id="rbLen"></span><span id="rbC">C 未打点</span></div>
    </div>

    <div class="card" data-role="A">
      <div class="cardTop">
        <span class="role">A</span>
        <span class="cv unset" id="lvA">未打点</span>
        <span class="spacer"></span>
        <button class="chip" data-set="A">打点</button>
        <button class="chip icon" id="lpA" data-play="a" title="听这一小段">▶</button>
      </div>
      <canvas id="lcA"></canvas>
    </div>

    <div class="card" data-role="C">
      <div class="cardTop">
        <span class="role">C</span>
        <span class="cv unset" id="lvC">未打点</span>
        <span class="spacer"></span>
        <button class="chip" data-set="C">打点</button>
        <button class="chip icon" id="lpC" data-play="c" title="听这一小段">▶</button>
      </div>
      <canvas id="lcC"></canvas>
    </div>

    <div class="slider" style="margin-top:8px">
      <span>波形宽度</span>
      <input type="range" id="zoom" min="0" max="5" step="1" value="2">
      <span class="v" id="zoom-v">±1.00s</span>
    </div>
    <div style="margin-top:8px">
      <button class="wide" id="btnPrev">听这一段</button>
    </div>
  </section>

  <!-- 02 写稿并合成：一屏唯一的重操作 -->
  <section class="grp">
    <div class="grpHead"><span class="step">02</span><span class="grpTitle">补上这一句</span></div>
    <textarea id="text" placeholder="写下这段话，它会用片子里自己的声音说出来……"></textarea>
    <div class="slider">
      <span>语速</span>
      <input type="range" id="speed" min="0.7" max="1.4" step="0.05" value="1.0">
      <span class="v" id="speed-v">1.00</span>
    </div>
    <div style="margin-top:11px">
      <button class="primary" id="btnGen" disabled>
        <span class="pfill" id="genFill"></span>
        <span class="ptxt" id="genTxt">合成旁白</span>
      </button>
    </div>
    <div class="why" id="genWhy"></div>
  </section>

  <!-- 03 试听：合成完最先要过的是这一关，满意了才有第四步 -->
  <section class="grp" id="g3" style="display:none">
    <div class="grpHead"><span class="step">03</span><span class="grpTitle">听一句像不像</span></div>
    <div class="player">
      <button class="playBig" id="btnNarPlay" title="播放这一段旁白">▶</button>
      <div class="ptrack" id="narTrack"><div class="pfill" id="narFill"></div></div>
      <span class="ptime" id="narTime">0:00 / 0:00</span>
    </div>
    <audio id="narAudio" preload="metadata"></audio>
    <div class="qc" id="qcBox" style="display:none">
      <div class="qcRow">
        <span class="lb">念得准不准</span>
        <span class="qcSim" id="qcSim">--</span>
        <span class="cnt" id="qcCnt"></span>
      </div>
      <details>
        <summary>它实际念出来的是</summary>
        <div class="asr" id="qcAsr"></div>
      </details>
    </div>
  </section>

  <!-- 04 去向：满意之后才轮到这两个出口，B 只住在第二个里面 -->
  <section class="grp" id="g4" style="display:none">
    <div class="grpHead"><span class="step">04</span><span class="grpTitle">然后去哪儿</span></div>

    <div class="exit">
      <div class="exitHead" id="exitHead">拿到剪辑软件里</div>
      <div class="exitName" id="outName"></div>
      <div class="exitRow">
        <button id="btnReveal">在访达中显示</button>
        <span class="mut" id="exitNote">拖进你自己的时间线</span>
      </div>
    </div>

    <div class="exit" id="exitStitch">
      <button class="link" id="btnStitchToggle">或者，就在这里插回去</button>
      <div class="stitch" id="stitchBox" style="display:none">
        <div class="card" data-role="B">
          <div class="cardTop">
            <span class="role">B</span>
            <span class="cv unset" id="lvB">未打点</span>
            <span class="spacer"></span>
            <button class="chip" data-set="B">打点</button>
            <button class="chip icon" id="lpB" data-play="b" title="听这一小段">▶</button>
          </div>
          <canvas id="lcB"></canvas>
        </div>
        <div style="margin-top:8px">
          <button class="primary" id="btnGen2" disabled>
            <span class="pfill" id="gen2Fill"></span>
            <span class="ptxt" id="gen2Txt">合成成品</span>
          </button>
        </div>
        <div class="why" id="gen2Why"></div>
      </div>
    </div>
  </section>

  <div class="status" id="st"></div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var API = "http://127.0.0.1:8733";
  var st = {
    pos: 0, dur: 0, file: "", path: "", a: null, b: null, c: null,
    backend: false, job: null, msg: "", notice: null, result: null,
    stageProgress: 0,
    // 插件推来的区间播放状态；playRole 是本地记的「最后按的是哪条轴的播放键」
    playing: false, prange: null, playRole: null,
  };

  function fmt(s) {
    if (s === null || s === undefined || isNaN(s)) return "--:--";
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var mm = (h > 0) ? String(m).padStart(2, "0") : String(m);
    return (h > 0 ? h + ":" : "") + mm + ":" + String(x).padStart(2, "0");
  }

  // 打点要能落在毫秒上，只显示到秒就没法判断自己打在哪儿
  function fmtMs(s) {
    if (s === null || s === undefined || isNaN(s)) return "--";
    return fmt(s) + "." + String(Math.floor((s % 1) * 1000)).padStart(3, "0");
  }

  el("speed").oninput = function (e) {
    el("speed-v").textContent = (+e.target.value).toFixed(2);
  };

  function post(p, body) {
    return fetch(API + p, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); });
  }

  /*
   * 官方消息桥。IINA 在文档创建时就把 window.iina 注入进插件页面
   * （postMessage 走 webkit.messageHandlers.iina，onMessage 收插件推来的消息），
   * 插件侧对应的就是 iina.sidebar.postMessage / onMessage —— 即时双向，不用轮询。
   */
  /*
   * 即便 window.iina 存在，也不能假定这条通路一定送得过来 —— 插件侧如果没接住
   * （例如注册监听的时机被 loadFile 清掉），这里就会一直收不到状态。
   * 所以 useBridge 是可降级的：收不到东西就把它关掉，退回轮询。
   */
  var bridge = (window.iina && typeof window.iina.postMessage === "function") ? window.iina : null;
  var useBridge = !!bridge;
  var gotState = false;
  var polling = false;

  // 面板 → 插件。桥不通时，这些指令改写成旧的会话字段，让插件轮询取走
  var LEGACY = {
    setMark: function (d) { var p = {}; p[d.role] = d.t; return { marks: p }; },
    setMarkAt: function (d) { var p = {}; p[d.role] = d.t; return { marks: p }; },
    clearMarks: function () { return { marks: { a: null, b: null, c: null } }; },
    preview: function () { return { want_preview: true }; },
    // 没有桥就做不到「播一段自动停」，退到区间开头算了，剩下的交给用户按空格
    playRange: function (d) { return { want_goto: d.from }; },
    stop: function () { return { want_pause_toggle: true }; },
    goto: function (d) { return { want_goto: d.t }; },
    toggle: function () { return { want_pause_toggle: true }; },
  };

  function send(cmd, data) {
    if (useBridge) { bridge.postMessage("cmd", { cmd: cmd, data: data || {} }); return; }
    var f = LEGACY[cmd];
    if (f) post("/api/session", f(data || {})).catch(function () {});
  }

  function applyState(d) {
    gotState = true;
    if (d.pos !== undefined) st.pos = d.pos;
    if (d.dur !== undefined) st.dur = d.dur;
    if (d.playing !== undefined) {
      st.playing = !!d.playing;
      st.prange = d.prange || null;
      if (!st.playing) st.playRole = null;   // 播完了，按钮复位
    }
    if (d.name || d.path) {
      if (d.path && d.path !== st.path) PEAKS = { a: null, b: null, c: null };
      st.file = d.name || d.path; st.path = d.path || "";
    }
    // 拖动期间不能让插件推来的 marks 覆盖本地 —— 插件那边的打点要到松手才更新，
    // 它每轮推的还是旧值，照单全收的话拖到一半会被打回去
    if (d.marks && !dragging) { st.a = d.marks.a; st.b = d.marks.b; st.c = d.marks.c; }
    paint();
  }

  /*
   * 焦点。这块面板是播放器侧栏里的一个 WKWebView：它拿到 first responder 之后，
   * 空格就落进网页而不是播放器，表现是「敲空格没反应」。IINA 只在窗口重新变成
   * key window 时把焦点收回去，所以这里自己留两条退路 ——
   * Esc 或点面板空白处就交出焦点；焦点还停在面板里（但不在输入框）时，
   * 空格转发给播放器去暂停。
   */
  function isTyping() {
    var a = document.activeElement;
    return !!a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT");
  }
  function handBackFocus() {
    var a = document.activeElement;
    if (a && a.blur) a.blur();
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { handBackFocus(); return; }
    if (e.key === " " && !isTyping()) {
      e.preventDefault();          // 别让网页把这一下当成滚动
      send("toggle");
    }
  });
  document.addEventListener("mousedown", function (e) {
    if (isTyping() && e.target && !e.target.closest("input, textarea, button, a, select")) {
      handBackFocus();
    }
  });

  // 桥通了就不用轮询：插件把状态直接推过来。桥不通才退回旧办法 ——
  // 插件把状态写进后端会话，面板到这里取。
  function poll() {
    return fetch(API + "/api/session")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        st.backend = true;
        applyState(d);
        // 插件不能在自己的 http 回调里弹提示（那个回调跑在后台队列，碰 AppKit
        // 会让播放器 abort），这类提示寄存在会话里，由面板代显示。
        st.notice = (d.notice && Date.now() / 1000 - d.notice.at < 6) ? d.notice : null;
        paint();
      })
      .catch(function () { st.backend = false; paint(); });
  }

  // 桥只管播放器这一侧；后端是否还活着（合成要走它）得自己问一次。
  // 没连上才慢慢重试，别刷屏
  function probeBackend() {
    fetch(API + "/api/session")
      .then(function (r) { return r.json(); })
      .then(function () { st.backend = true; paint(); })
      .catch(function () { st.backend = false; paint(); });
  }

  function startPolling(why) {
    if (polling) return;
    polling = true;
    if (why) { st.msg = why; paint(); }
    setInterval(poll, 400);
    poll();
  }

  if (useBridge) {
    bridge.onMessage("state", applyState);
    bridge.onMessage("marks", function (d) { st.a = d.a; st.b = d.b; st.c = d.c; paint(); });
    bridge.onMessage("notice", function (d) {
      st.notice = (d && Date.now() / 1000 - d.at < 6) ? d : null;
      paint();
    });
    bridge.postMessage("ui-ready", {});
    probeBackend();
    setInterval(function () { if (!st.backend) probeBackend(); }, 3000);
    // 看门狗：桥在，但插件侧一直没把状态送过来（多半是它没接住消息），
    // 那就别干等，退回轮询让面板照常能用
    setTimeout(function () {
      if (!gotState) { useBridge = false; startPolling("插件未推送状态，已改用轮询"); }
    }, 2500);
  } else {
    startPolling();
  }

  function setMark(role) {
    send("setMark", { role: role, t: st.pos });
  }

  function clearMarks() {
    send("clearMarks");
  }

  /* ---------- 波形轨道 ----------
   *
   * 一个点一条轴，各自以自己的打点为中心画同一段波形。
   * 中间那条固定的竖线才是打点的位置：把波形往右拖，等于让竖线指向更早的内容，
   * 也就是把打点往前挪。
   *
   * 波形不是整轨压成的粗粒度概览 —— 那样放大到秒级以下就糊了。这里只向后端
   * 要「打点附近一小段、固定毫秒级格宽」的波形，长片也一样快。
   */

  var HALVES = [0.25, 0.5, 1, 2, 4, 8];    // 轨道可见的半窗口（秒）
  var halfIdx = 2;
  var PEAKS = { a: null, b: null, c: null };
  var pending = { a: false, b: false, c: false };
  var dragging = null;
  var CSSV = {};
  var LANE_H = 40;

  function readCss() {
    var s = getComputedStyle(document.documentElement);
    ["--bread", "--brand", "--muted", "--text"].forEach(function (n) {
      CSSV[n] = s.getPropertyValue(n).trim();
    });
  }
  function half() { return HALVES[halfIdx]; }

  /** 打点不能越过邻居，也不能出界 —— 拖到底就停在那儿，不让它错位。 */
  function clampMark(role, t) {
    // 时长还没拿到时先放开上界，否则会把 C 一路钳到 0
    var lo = 0, hi = (st.dur > 0) ? st.dur : Infinity;
    if (role === "a") {
      hi = (st.b !== null ? st.b : (st.c !== null ? st.c : hi)) - 0.001;
    } else if (role === "b") {
      lo = (st.a !== null ? st.a : 0) + 0.001;
      hi = (st.c !== null ? st.c : hi) - 0.001;
    } else {
      lo = (st.b !== null ? st.b : (st.a !== null ? st.a : 0)) + 0.001;
    }
    if (hi < lo) hi = lo;
    return Math.min(Math.max(t, Math.max(0, lo)), hi);
  }

  function peaksFresh(role) {
    var p = PEAKS[role], t = st[role];
    if (!p || !p.peaks || t === null) return false;
    // 留出两倍窗口的余量，拖动时不至于每动一下就要重新解码
    var margin = half() * 2;
    return t - margin >= p.t0 && t + margin <= p.t0 + p.span;
  }

  function ensurePeaks(role) {
    var t = st[role];
    if (t === null || !st.path) { PEAKS[role] = null; return; }
    if (peaksFresh(role) || pending[role]) return;
    pending[role] = true;
    var span = Math.min(60, Math.max(4, half() * 12));
    fetch(API + "/api/peaks?path=" + encodeURIComponent(st.path) +
          "&center=" + t + "&span=" + span)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        pending[role] = false;
        if (d && d.peaks) { PEAKS[role] = d; drawLane(role); }
      })
      .catch(function () { pending[role] = false; });
  }

  function drawLane(role) {
    var cv = el("lc" + role.toUpperCase());
    if (!cv || !cv.getContext) return;
    var w = cv.clientWidth || 240;
    if (!w) return;                       // 折叠起来的轴不用画
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(LANE_H * dpr);
    }
    var g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, LANE_H);

    var t = st[role], p = PEAKS[role];
    g.font = '11px -apple-system, "PingFang SC", sans-serif';
    g.textAlign = "center";
    if (t === null) {
      g.fillStyle = CSSV["--muted"] || "#888";
      g.fillText("打点后可以在这里拖着微调", w / 2, LANE_H / 2 + 4);
      return;
    }
    if (p && p.peaks && p.peaks.length) {
      var t0 = t - half(), n = p.peaks.length;
      g.fillStyle = (role === "b") ? (CSSV["--brand"] || "#cf9413")
                                   : (CSSV["--bread"] || "#8a6a3d");
      for (var x = 0; x < w; x++) {
        var ta = t0 + (x / w) * half() * 2;
        var tb = t0 + ((x + 1) / w) * half() * 2;
        var i0 = Math.floor((ta - p.t0) / p.res);
        var i1 = Math.ceil((tb - p.t0) / p.res);
        if (i1 <= i0) i1 = i0 + 1;
        if (i0 < 0) i0 = 0;
        if (i1 > n) i1 = n;
        if (i0 >= n) continue;
        var v = 0;
        for (var i = i0; i < i1; i++) { if (p.peaks[i] > v) v = p.peaks[i]; }
        var bh = Math.max(1, v * (LANE_H - 8));
        g.fillRect(x, (LANE_H - bh) / 2, 1, bh);
      }
    } else {
      g.fillStyle = CSSV["--muted"] || "#888";
      g.fillText("波形读取中…", w / 2, LANE_H / 2 + 4);
    }
    // 中线：这一条才是打点所在的位置
    g.fillStyle = CSSV["--brand"] || "#cf9413";
    g.fillRect(Math.round(w / 2) - 0.75, 0, 1.5, LANE_H);

    drawPlayhead(g, w, t - half(), t + half());
  }

  /**
   * 播放头。轴能看见的只有 [t0, t1] 这一小段，播放头落在里面就画一条随播移动的
   * 竖线（带三角，好跟中间那条固定的打点竖线区分）；落到窗外只在边缘画个箭头 ——
   * 播 A→C 那种长区间时，播放头多半已经扫出视野了。
   */
  function drawPlayhead(g, w, t0, t1) {
    var head = CSSV["--text"] || "#1d1b18";
    var span = t1 - t0;
    if (st.pos >= t0 && st.pos <= t1) {
      var px = ((st.pos - t0) / span) * w;
      g.fillStyle = head;
      g.fillRect(px - 0.5, 0, 1, LANE_H);
      g.beginPath();
      g.moveTo(px - 3.5, 0); g.lineTo(px + 3.5, 0); g.lineTo(px, 5.5);
      g.closePath(); g.fill();
      return;
    }
    if (!st.playing) return;
    var right = st.pos > t1;
    var ex = right ? w - 5 : 5;
    g.fillStyle = head;
    g.beginPath();
    if (right) { g.moveTo(ex + 4, LANE_H - 8); g.lineTo(ex + 4, LANE_H - 2); g.lineTo(ex, LANE_H - 5); }
    else { g.moveTo(ex - 4, LANE_H - 8); g.lineTo(ex - 4, LANE_H - 2); g.lineTo(ex, LANE_H - 5); }
    g.closePath(); g.fill();
  }

  /**
   * 播一条轴。播的就是这条轴上能看见的那一小段（± 波形宽度），
   * 所以播放头一定会在视野里从左扫到右 —— 微调时听得见也看得见。
   */
  function playLane(role) {
    var h = half();
    stopNarration();
    send("playRange", {
      from: Math.max(0, st[role] - h), to: st[role] + h,
      label: role.toUpperCase() + " 附近 ±" + h.toFixed(2) + "s",
    });
    if (useBridge) {
      // 插件要下一轮才把 playing 推回来，这里先乐观地切一下，别让按钮慢半拍
      st.playing = true;
      st.playRole = role;
      st.prange = { from: Math.max(0, st[role] - h), to: st[role] + h };
    } else {
      st.msg = "已跳到这一段开头（没走官方桥时不会自动停）";
    }
    paint();
  }

  document.querySelectorAll("[data-play]").forEach(function (b) {
    b.addEventListener("click", function () {
      var role = b.getAttribute("data-play");
      if (st[role] === null) { st.msg = "先打上这个点，才能听它附近"; paint(); return; }
      if (st.playing && st.playRole === role) {   // 再点一次就是停
        send("stop");
        st.playing = false; st.playRole = null; st.prange = null;
        paint();
        return;
      }
      playLane(role);
    });
  });

  function refreshLanes() {
    ["a", "b", "c"].forEach(function (role) {
      var v = el("lv" + role.toUpperCase());
      v.textContent = (st[role] === null) ? "未打点" : fmtMs(st[role]);
      v.className = "cv" + (st[role] === null ? " unset" : "");
      ensurePeaks(role);
      drawLane(role);
    });
  }

  ["a", "b", "c"].forEach(function (role) {
    var cv = el("lc" + role.toUpperCase());
    var startX = 0, startT = 0, moved = false;

    cv.addEventListener("pointerdown", function (e) {
      if (st[role] === null) return;
      dragging = role;
      startX = e.clientX;
      startT = st[role];
      moved = false;
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      e.preventDefault();
    });

    cv.addEventListener("pointermove", function (e) {
      if (dragging !== role) return;
      var w = cv.clientWidth || 240;
      if (Math.abs(e.clientX - startX) > 1) moved = true;
      // 波形往右拖 → 竖线指向更早的内容 → 打点往前挪
      var dt = (e.clientX - startX) / w * half() * 2;
      st[role] = clampMark(role, startT - dt);
      paint();          // paint 末尾会顺带刷新三条轨道
    });

    // 松手才落库：拖动过程中一直往插件发消息既吵，也会让播放器不停跳转
    cv.addEventListener("pointerup", function (e) {
      if (dragging !== role) return;
      dragging = null;
      try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      if (!moved) return;
      send("setMarkAt", { role: role, t: st[role] });
      if (st.playing && st.playRole === role) {
        playLane(role);   // 边听边挪：松手就接着从新位置播，不必再点一次
      } else {
        send("goto", { t: st[role] });   // 跳过去听一下，确认落在哪个字前面
      }
      ensurePeaks(role);
    });
    cv.addEventListener("pointercancel", function () { dragging = null; });
  });

  el("zoom").oninput = function (e) {
    halfIdx = (+e.target.value) || 0;
    el("zoom-v").textContent = "±" + half().toFixed(2) + "s";
    // 缩放一变，需要的分辨率与窗口长度都变了，缓存全部作废
    PEAKS = { a: null, b: null, c: null };
    refreshLanes();
  };

  /**
   * 参考条。整片的进度不用在面板里再画一条（播放器自己就有），
   * 但「旁白要照着来的那一段」值得单独一条：常驻着，没打点时是空骨架，
   * 打齐了就在里面画出 A→C，B 的位置也标在上面。
   */
  function paintRefbar() {
    var ok = st.a !== null && st.c !== null && st.c > st.a;
    var bar = el("refbar");
    bar.className = "refbar" + (ok ? "" : " empty");
    el("refEmpty").style.display = ok ? "none" : "flex";
    el("refFill").style.display = ok ? "block" : "none";
    el("refEdgeA").style.display = ok ? "block" : "none";
    el("refEdgeC").style.display = ok ? "block" : "none";
    if (!ok) {
      el("rbA").textContent = "A 未打点";
      el("rbC").textContent = "C 未打点";
      el("rbLen").textContent = "";
      el("rbB").style.display = "none";
      el("rhead").style.display = "none";
      return;
    }
    var span = st.c - st.a;
    var at = function (t) { return ((t - st.a) / span * 100) + "%"; };

    el("refFill").style.left = at(st.a);
    el("refFill").style.right = "auto";
    el("refFill").style.width = ((st.c - st.a) / span * 100) + "%";
    el("refEdgeA").style.left = at(st.a);
    el("refEdgeC").style.left = at(st.c);

    var hasB = st.b !== null && st.b > st.a && st.b < st.c;
    el("rbB").style.display = hasB ? "block" : "none";
    if (hasB) el("rbB").style.left = at(st.b);

    // 播放头只在落进 A→C 时才画：在这段之外，它对试听没有意义
    var inside = st.pos >= st.a && st.pos <= st.c;
    el("rhead").style.display = inside ? "block" : "none";
    if (inside) el("rhead").style.left = at(st.pos);

    el("rbA").textContent = fmtMs(st.a);
    el("rbC").textContent = fmtMs(st.c);
    el("rbLen").textContent = span.toFixed(2) + "s" +
      (hasB ? " · B 在 " + (st.b - st.a).toFixed(2) + "s" : "");

    // 正在播的就是 A→C 时把这条点亮，说明「现在听的是这一段」
    var pr = st.prange;
    var on = !!(st.playing && pr && pr.from <= st.a + 0.01 && pr.to >= st.c - 0.01);
    if (on) bar.className = "refbar on";
  }

  // 点条上任意一处就跳过去 —— 想从中间听一句，不必先拖播放器
  el("refbar").addEventListener("click", function (e) {
    if (!(st.a !== null && st.c !== null && st.c > st.a)) return;
    var box = el("refbar");
    var r = (box.getBoundingClientRect && box.getBoundingClientRect()) ||
            { left: 0, width: box.clientWidth || 0 };
    var f = Math.min(1, Math.max(0, (e.clientX - (r.left || 0)) / (r.width || 1)));
    var t = st.a + f * (st.c - st.a);
    st.pos = t;                 // 插件下一轮才把新位置推回来，先自己挪一下
    send("goto", { t: t });
    paint();
  });

  /* ---------- 旁白播放：合成出来的那一段由网页自己播 ----------
   * 参考监听的是原声，得交给播放器；旁白是面板自己产出的文件，
   * 用 audio 元素播最直接 —— 它有独立的进度，能反复听这一句到底像不像。
   */
  var nar = el("narAudio");

  function narStopUi() {
    el("btnNarPlay").textContent = "▶";
    el("btnNarPlay").className = "playBig";
  }
  function stopNarration() {
    if (nar && !nar.paused) { nar.pause(); nar.currentTime = 0; }
    narStopUi();
    paintNarProgress();
  }
  function paintNarProgress() {
    var d = nar.duration;
    if (!d || isNaN(d)) { el("narFill").style.width = "0%"; return; }
    el("narFill").style.width = ((nar.currentTime / d) * 100) + "%";
    el("narTime").textContent = fmt(nar.currentTime) + " / " + fmt(d);
  }
  nar.addEventListener("timeupdate", paintNarProgress);
  nar.addEventListener("loadedmetadata", paintNarProgress);
  nar.addEventListener("ended", function () { narStopUi(); paintNarProgress(); });
  nar.addEventListener("play", function () {
    el("btnNarPlay").textContent = "■";
    el("btnNarPlay").className = "playBig on";
  });
  el("btnNarPlay").addEventListener("click", function () {
    if (!nar.src) return;
    if (!nar.paused) { nar.pause(); narStopUi(); return; }
    // 别让播放器里的原声和旁白叠在一起
    if (st.playing) { send("stop"); st.playing = false; st.playRole = null; st.prange = null; }
    nar.play().catch(function () { st.msg = "这一段播不出来"; paint(); });
    paint();
  });
  el("narTrack").addEventListener("click", function (e) {
    var d = nar.duration;
    if (!d || isNaN(d)) return;
    var box = el("narTrack");
    var r = (box.getBoundingClientRect && box.getBoundingClientRect()) ||
            { left: 0, width: box.clientWidth || 0 };
    var f = Math.min(1, Math.max(0, (e.clientX - (r.left || 0)) / (r.width || 1)));
    nar.currentTime = f * d;
    paintNarProgress();
  });

  function paintQc(res) {
    var q = res && res.qc;
    if (!q || q.error || q.similarity === undefined) {
      el("qcBox").style.display = "none";
      return;
    }
    el("qcBox").style.display = "block";
    var v = Math.round(q.similarity * 1000) / 10;
    var s = el("qcSim");
    s.textContent = v.toFixed(1) + "%";
    s.className = "qcSim " + (v >= 95 ? "good" : (v >= 85 ? "mid" : "low"));
    el("qcCnt").textContent = (q.diff_count ? q.diff_count + " 处不一致" :
                               (typeof q.diff_count === "number" ? "逐字一致" : ""));
    el("qcAsr").textContent = q.asr_text || "";
  }

  /**
   * mode = "narration" 只合成旁白（不切面包、不拼接）；
   * mode = "sandwich" 才是把旁白夹回 A→B、B→C 之间。两者共用同一条流水线，
   * 差别只在后端要不要继续做下去。
   *
   * 界面上是同一条路：先合成旁白，听完决定要不要插回去。
   */
  function run(mode) {
    if (!st.path) { st.msg = "先在播放器里打开一个文件"; paint(); return; }
    st.result = null;
    st.jobPending = true;
    st.msg = "正在读取素材…";
    stopNarration();
    paint();
    var narOnly = (mode === "narration");

    post("/api/open", { path: st.path })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error || "打不开这个文件");
        st.job = r.id;
        st.msg = "正在合成，第一次要约一分钟…";
        paint();
        return post("/api/job/" + r.id + "/generate", {
          a: st.a, b: st.b, c: st.c,
          text: el("text").value.trim(),
          mode: mode, speed: +el("speed").value || 1.0,
          auto_ref: true, pace: false, unify_loudness: false, qc: true,
        });
      })
      .then(function () {
        var tick = setInterval(function () {
          fetch(API + "/api/job/" + st.job)
            .then(function (r) { return r.json(); })
            .then(function (j) {
              st.msg = j.message || j.stage;
              st.stageProgress = (typeof j.progress === "number") ? j.progress : 0;
              paint();
              if (j.stage === "done" || j.stage === "error") {
                clearInterval(tick);
                st.job = null;
                st.stageProgress = 0;
                if (j.stage === "done") {
                  st.result = j.result || null;
                  if (st.result && st.result.narration) {
                    nar.src = API + st.result.narration;
                    nar.load();
                  }
                  st.msg = (st.result && st.result.mode === "narration")
                    ? "听着行就往下走第 04 步"
                    : "成品已生成，就在下方";
                  var pc = st.result && st.result.pace;
                  if (pc && pc.reason) st.msg = "语速对齐：" + pc.reason + "。" + st.msg;
                } else {
                  st.result = null;
                  st.msg = "出错：" + (j.error || "未知原因");
                }
                paint();
              }
            })
            .catch(function () {});
        }, 700);
      })
      .catch(function (e) {
        st.job = null;
        st.stageProgress = 0;
        st.msg = "失败：" + (e.message || e);
        paint();
      });
  }

  /** 差什么就说明白，别让用户对着一个灰按钮猜。 */
  function missing() {
    var m = [];
    if (!st.backend) m.push("本机服务（没起来就跑 ./run.sh）");
    else if (!st.path) m.push("一个正在播放的文件");
    if (!(st.a !== null && st.c !== null && st.c > st.a)) m.push("取样区间 A→C");
    if (!el("text").value.trim()) m.push("一句旁白");
    return m;
  }
  function missingStitch() {
    if (!st.result) return "先在第 02 步合成旁白";
    if (st.b === null) return "打上插入点 B：旁白会从这里插进去";
    if (!(st.a < st.b && st.b < st.c)) return "B 要落在 A 和 C 之间";
    return "";
  }

  function paint() {
    el("file").textContent = st.file || "未在播放";
    el("file").title = st.file || "";
    el("pos").textContent = fmt(st.pos);
    el("dur").textContent = fmt(st.dur);
    el("dot").className = "dot " + (st.backend ? "on" : "off");

    var busy = !!st.job;
    var m = missing();
    var canGen = !busy && m.length === 0;
    el("btnGen").disabled = !canGen;
    el("genTxt").textContent = busy ? (st.msg || "正在合成…") : "合成旁白";
    el("genFill").style.width = busy ? (st.stageProgress * 100) + "%" : "0%";
    el("genWhy").textContent = busy ? "" : (m.length ? "还需要：" + m.join("、")
                                                     : "会用 A→C 这一段的音色念出来");

    // 合成出来的东西都在第三步与第四步，没有结果就不占地方
    var has = !!st.result;
    el("g3").style.display = has ? "block" : "none";
    el("g4").style.display = has ? "block" : "none";
    if (has) {
      paintQc(st.result);
      var name = ((st.result.out_wav || "").split("/").pop()) || "";
      el("outName").textContent = name;
      el("outName").title = st.result.out_wav || "";
      var stitched = st.result.mode !== "narration";
      el("exitHead").textContent = stitched ? "成品" : "旁白 · 拿到剪辑软件里";
      el("exitNote").textContent = stitched ? "整段已经拼好" : "拖进你自己的时间线";
      el("exitStitch").style.display = stitched ? "none" : "block";

      var ms = missingStitch();
      el("btnGen2").disabled = !!ms;
      el("gen2Why").textContent = ms;
      el("gen2Fill").style.width = busy ? (st.stageProgress * 100) + "%" : "0%";
      el("gen2Txt").textContent = busy ? (st.msg || "正在合成…") : "合成成品";
    }

    // 哪条轴在播，就把它的键切成停止
    ["a", "b", "c"].forEach(function (k) {
      var pb = el("lp" + k.toUpperCase());
      var on = st.playing && st.playRole === k;
      pb.textContent = on ? "■" : "▶";
      pb.className = "chip icon" + (on ? " on" : "");
      pb.title = on ? "停止" : "听这一小段";
    });

    paintRefbar();

    if (st.notice) {
      el("st").textContent = st.notice.text;
      el("st").className = "status" + (st.notice.is_error ? " err" : "");
    } else {
      el("st").textContent = st.msg ||
        (st.backend ? "已连接本机服务" : "未连到本机服务（先跑 ./run.sh）");
      el("st").className = "status";
    }
    refreshLanes();
  }

  document.querySelectorAll("[data-set]").forEach(function (b) {
    b.addEventListener("click", function () {
      setMark(b.getAttribute("data-set").toLowerCase());
    });
  });
  el("btnReset").addEventListener("click", clearMarks);
  // 播放控制只能由插件做（面板拿不到 iina.core），这里只是下个指令
  el("btnPrev").addEventListener("click", function () {
    if (st.a === null || st.c === null) {
      st.msg = "先打上 A 和 C 才能试听";
      paint();
      return;
    }
    if (st.playing) {           // 正在播就先停下，不管播的是哪一段
      send("stop");
      st.playing = false; st.playRole = null; st.prange = null;
      st.msg = "已停止";
    } else {
      stopNarration();
      send("preview");
      st.playRole = null;
      st.msg = "正在播放 A→C，旁白会照这段的语气来";
    }
    paint();
  });

  el("btnStitchToggle").addEventListener("click", function () {
    var box = el("stitchBox");
    var open = box.style.display === "none";
    box.style.display = open ? "block" : "none";
    el("btnStitchToggle").textContent = open ? "收起" : "或者，就在这里插回去";
    if (open) { ensurePeaks("b"); drawLane("b"); }
  });

  el("text").addEventListener("input", paint);
  el("btnGen").addEventListener("click", function () { run("narration"); });
  el("btnGen2").addEventListener("click", function () { run("sandwich"); });
  el("btnReveal").addEventListener("click", function () {
    var p = st.result && (st.result.out_wav || st.result.out_dir);
    if (!p) return;
    post("/api/reveal", { path: p });
  });

  readCss();
  el("zoom-v").textContent = "±" + half().toFixed(2) + "s";
  paint();
})();
</script>
</body>
</html>
