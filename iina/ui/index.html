<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两面包夹芝士</title>
<style>
  /*
   * 界面本身不带颜色。
   * 颜色只属于内容：波形、选区、播放头 —— 外加唯一的强调色，它取系统设置里
   * 你自己挑的那一个（AccentColor）。UI 的分块一律靠留白与材质差，不靠描边。
   */
  :root {
    color-scheme: light dark;

    --label: rgba(0, 0, 0, 0.85);
    --label2: rgba(0, 0, 0, 0.5);
    --label3: rgba(0, 0, 0, 0.32);
    --chip: rgba(0, 0, 0, 0.05);
    --chipHi: rgba(0, 0, 0, 0.095);
    --sunken: rgba(0, 0, 0, 0.045);
    --hair: rgba(0, 0, 0, 0.1);
    --bad: #ff3b30;
    --warn: #ff9500;

    --accent: #0a84ff;
    --onAccent: #fff;

    /* canvas 里要用的四个：波形回归中性，中心竖线与播放头用强调色 */
    --bread: rgba(0, 0, 0, 0.42);
    --brand: #0a84ff;
    --muted: rgba(0, 0, 0, 0.3);
    --text: rgba(0, 0, 0, 0.85);

    --r: 10px;
    --rsm: 7px;
    --rxs: 5px;
  }
  @supports (color: AccentColor) {
    :root { --accent: AccentColor; --onAccent: AccentColorText; --brand: AccentColor; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --label: rgba(255, 255, 255, 0.9);
      --label2: rgba(255, 255, 255, 0.55);
      --label3: rgba(255, 255, 255, 0.34);
      --chip: rgba(255, 255, 255, 0.08);
      --chipHi: rgba(255, 255, 255, 0.14);
      --sunken: rgba(255, 255, 255, 0.055);
      --hair: rgba(255, 255, 255, 0.11);
      --bad: #ff453a;
      --warn: #ff9f0a;
      --bread: rgba(255, 255, 255, 0.4);
      --muted: rgba(255, 255, 255, 0.28);
      --text: rgba(255, 255, 255, 0.9);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;                 /* 窗口本身是最外层那张卡片：内边距统一 s3（12px） */
    background: transparent;
    color: var(--label);
    font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
  }

  /* 顶部这一行是元信息，不是标题栏：文件名与时间码同一行，服务状态只占一个点 */
  .top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label2); }
  .top .title { color: var(--label); font-weight: 500; }
  .top .file {
    max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top .tc { margin-left: auto; display: flex; align-items: center; gap: 5px; flex: none; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label3); flex: none; }
  .dot.on { background: var(--accent); }
  .dot.off { background: var(--bad); }

  /*
   * 选区条 —— 整个取样动作都发生在这里，它是唯一的操作面：
   * 拖一下□出选区，拖把手改边界，拖里面整个挪，拖plot之外的空白处重来。
   */
  .refrange { margin-top: 13px; }
  .range {
    position: relative; height: 34px; border-radius: var(--rsm); overflow: hidden;
    background: var(--sunken); cursor: crosshair; touch-action: none;
  }
  .range canvas { display: block; width: 100%; height: 34px; }
  .range.blank canvas { opacity: .45; }
  /* 覆盖层一律不吃指针：手势全由 canvas 统一处理 */
  .range .sel { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .15; pointer-events: none; }
  .range .grip {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none;
  }
  .range .grip::after {
    content: ""; position: absolute; top: 50%; left: -3px;
    width: 8px; height: 15px; margin-top: -7.5px; border-radius: 2.5px; background: var(--accent);
  }
  .range .rb {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--label);
    opacity: .5; pointer-events: none;
  }
  .range .rhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--label); pointer-events: none; }
  .range .invite {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--label2); pointer-events: none; text-align: center; padding: 0 12px;
  }
  .refmeta {
    display: flex; justify-content: space-between; gap: 8px; margin-top: 5px;
    font-size: 11px; color: var(--label2);
  }
  .refmeta .hint { color: var(--label3); }

  /* 两条轴是一组端点，不是一个一个的盒子；它们是同一个选区的两个放大镜 */
  .lanes {
    margin-top: 8px; border-radius: var(--rsm); overflow: hidden; background: var(--sunken);
  }
  .lane { position: relative; }
  .lane + .lane { border-top: 0.5px solid var(--hair); }
  .lane canvas {
    display: block; width: 100%; height: 44px; touch-action: none; cursor: ew-resize;
  }
  .lane:hover canvas { background: var(--chip); }
  .laneTag {
    position: absolute; left: 8px; top: 6px; pointer-events: none;
    font: 500 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--label2); letter-spacing: .05em;
  }
  /* 轴上的操作平时藏着，指针进来了才浮出来 —— 波形自己才是主角 */
  .laneTop {
    position: absolute; right: 6px; top: 5px; display: flex; align-items: center; gap: 4px;
    opacity: 0; transition: opacity .12s ease;
  }
  .lane:hover .laneTop, .laneTop:focus-within, .laneTop:has(.on) { opacity: 1; }

  .cv {
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--label); font-variant-numeric: tabular-nums;
  }
  .cv.unset { color: var(--label3); font-weight: 400; }

  button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: none; border-radius: var(--rsm); padding: 0 12px; height: 26px;
    background: var(--chip); color: var(--label);
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  button:hover { background: var(--chipHi); }
  button:active { opacity: .6; }
  button[disabled] { opacity: .32; cursor: default; }
  button[disabled]:hover { background: var(--chip); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(10, 132, 255, .3); }

  .chip {
    height: 20px; min-width: 22px; padding: 0 6px; font-size: 11px;
    line-height: 20px; color: var(--label2);
  }
  .chip:hover { color: var(--label); }
  .chip.on { background: var(--accent); color: var(--onAccent); }
  .chip.icon { padding: 0; min-width: 22px; }

  button.link { height: auto; padding: 3px 0; font-size: 11px; background: none; color: var(--label2); }
  button.link:hover { background: none; color: var(--label); text-decoration: underline; }

  /* 唯一的重色块：这一屏的目的地 */
  button.primary {
    position: relative; display: block; width: 100%; height: 32px;
    font-size: 13px; font-weight: 500; border-radius: 8px;
    background: var(--accent); color: var(--onAccent); overflow: hidden;
  }
  button.primary:hover { background: var(--accent); }
  button.primary[disabled] { opacity: .3; }

  .pfill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: var(--label); opacity: .18; transition: width .3s linear;
  }
  .ptxt { position: relative; }

  .tools { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .tools .sp { flex: 1; }
  @media (max-width: 252px) { .tools { flex-wrap: wrap; } }

  textarea {
    display: block; width: 100%; min-height: 84px; resize: vertical; margin-top: 15px;
    background: var(--chip); color: var(--label); font: inherit; line-height: 1.55;
    border: none; border-radius: var(--rsm); padding: 8px 10px; outline: none;
    -webkit-user-select: text;
  }
  textarea::placeholder { color: var(--label3); }
  textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }

  input[type=range] { accent-color: var(--accent); }

  /* 重录时才需要的东西，第一次合成之前不占版面 */
  .tune { display: none; }
  .tune.show { display: block; }
  .slider { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--label3); }
  .slider input[type=range] { flex: 1; min-width: 0; }
  .slider .v {
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--label2); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .why { font-size: 11px; color: var(--label3); margin-top: 5px; }

  /* 结果长出来之前，这一屏只到主按钮为止 */
  .blk { margin-top: 17px; }

  .player { display: flex; align-items: center; gap: 10px; }
  .playBig {
    width: 30px; height: 30px; padding: 0; flex: none; border-radius: 50%; font-size: 11px;
  }
  .playBig.on { background: var(--accent); color: var(--onAccent); }
  .ptrack { flex: 1; height: 5px; border-radius: 3px; background: var(--sunken); cursor: pointer; position: relative; }
  .ptrack .pfill { background: var(--accent); border-radius: 3px; }
  .ptime {
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--label2); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums;
  }

  .qc { margin-top: 10px; font-size: 11px; color: var(--label2); }
  .qcRow { display: flex; align-items: baseline; gap: 6px; }
  .qcSim { font: 500 13px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--label); }
  /* 念准了是常态，不值得上色；只有念歪了才需要颜色提醒 */
  .qcSim.mid { color: var(--warn); }
  .qcSim.low { color: var(--bad); }
  .qcRow .cnt { color: var(--label3); }
  .qc details { margin-top: 4px; }
  .qc summary { font-size: 11px; color: var(--label2); cursor: pointer; list-style: none; }
  .qc summary::-webkit-details-marker { display: none; }
  .qc summary .tri { display: inline-block; transition: transform .12s ease; color: var(--label3); }
  .qc details[open] summary .tri { transform: rotate(90deg); }
  .asr {
    margin-top: 4px; font-size: 11px; line-height: 1.6; color: var(--label2);
    -webkit-user-select: text;
  }

  .outHead { font-size: 11px; color: var(--label3); }
  .outName {
    font: 500 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all; color: var(--label); margin-top: 2px;
  }
  .outRow { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .outRow button { height: 24px; font-size: 11px; }
  .outRow .mut { font-size: 11px; color: var(--label3); }
  .stitch { margin-top: 7px; }

  .status { margin-top: 13px; font-size: 11px; color: var(--label3); min-height: 15px; }
  .status.err { color: var(--bad); }

</style>
</head>
<body>
  <div class="top">
    <span class="dot off" id="dot" title="本机服务的连接状态"></span>
    <span class="title">两面包夹芝士</span>
    <span class="tc">
      <span class="file" id="file">未在播放</span>
      <span id="pos">--:--</span>/<span id="dur">--:--</span>
    </span>
  </div>

  <!-- 取样。整个动作只有这一处：拖出一段就完事，不需要先打点再调精度再验证。 -->
  <div class="refrange">
    <div class="range blank" id="refbar" title="拖一下框出一段；拖两端改边界；点一下跳过去">
      <canvas id="ov"></canvas>
      <div class="sel" id="refFill" style="display:none"></div>
      <div class="grip" id="refEdgeA" style="display:none"></div>
      <div class="grip" id="refEdgeC" style="display:none"></div>
      <div class="rb" id="rbB" style="display:none"></div>
      <div class="rhead" id="rhead" style="display:none"></div>
      <div class="invite" id="refEmpty">在这段声音上拖一段，它会照着念</div>
    </div>
    <div class="refmeta">
      <span class="hint" id="hintRange"></span>
      <span id="rbLen"></span>
    </div>
  </div>

  <!-- 两条轴是上面那段选区的两个端点放大镜：大家 second只在要把边界挪到字缝上时用 -->
  <div class="lanes">
    <div class="lane" data-role="a">
      <canvas id="lcA"></canvas>
      <span class="laneTag">A</span>
      <div class="laneTop">
        <span class="cv unset" id="lvA">未取样</span>
        <button class="chip icon" id="lpA" data-play="a" title="听这一小段">▶</button>
        <button class="chip icon" data-set="A" title="把播放头所在处挪到这里">•</button>
      </div>
    </div>
    <div class="lane" data-role="c">
      <canvas id="lcC"></canvas>
      <span class="laneTag">C</span>
      <div class="laneTop">
        <span class="cv unset" id="lvC">未取样</span>
        <button class="chip icon" id="lpC" data-play="c" title="听这一小段">▶</button>
        <button class="chip icon" data-set="C" title="把播放头所在处挪到这里">•</button>
      </div>
    </div>
  </div>
  <div class="refmeta"><span class="hint" id="hintLane"></span></div>

  <div class="tools">
    <span class="sp"></span>
    <button class="link" id="btnReset">清空</button>
    <button id="btnPrev" title="听这一整段，旁白就照它的语气来">听这一段</button>
  </div>

  <textarea id="text" placeholder="写下这段话，它会用片子里自己的声音说出来……"></textarea>

  <div class="slider tune" id="tuneBox">
    <span>语速</span>
    <input type="range" id="speed" min="0.7" max="1.4" step="0.05" value="1.0">
    <span class="v" id="speed-v">1.00</span>
  </div>

  <div style="margin-top:11px">
    <button class="primary" id="btnGen" disabled>
      <span class="pfill" id="genFill"></span>
      <span class="ptxt" id="genTxt">合成旁白</span>
    </button>
  </div>
  <div class="why" id="genWhy"></div>

  <!-- 听过才算数：满意了才有下面的出口 -->
  <div class="blk" id="g3" style="display:none">
    <div class="player">
      <button class="playBig" id="btnNarPlay" title="播放这一段旁白">▶</button>
      <div class="ptrack" id="narTrack"><div class="pfill" id="narFill"></div></div>
      <span class="ptime" id="narTime">0:00 / 0:00</span>
    </div>
    <audio id="narAudio" preload="metadata"></audio>
    <div class="qc" id="qcBox" style="display:none">
      <div class="qcRow">
        <span class="qcSim" id="qcSim">--</span>
        <span>念准了</span>
        <span class="cnt" id="qcCnt"></span>
      </div>
      <details>
        <summary><span class="tri">▶</span> 它实际念出来的是</summary>
        <div class="asr" id="qcAsr"></div>
      </details>
    </div>
  </div>

  <div class="blk" id="g4" style="display:none">
    <div class="outHead" id="exitHead"></div>
    <div class="outName" id="outName"></div>
    <div class="outRow">
      <button id="btnReveal">在访达中显示</button>
      <span class="mut" id="exitNote"></span>
    </div>
    <div id="exitStitch">
      <div class="stitch">
        <button class="link" id="btnStitchToggle">或者，就在这里插回去</button>
      </div>
      <div id="stitchBox" style="display:none">
        <div class="lanes">
          <div class="lane" data-role="b">
            <canvas id="lcB"></canvas>
            <span class="laneTag">B</span>
            <div class="laneTop">
              <span class="cv unset" id="lvB">未定点</span>
              <button class="chip icon" id="lpB" data-play="b" title="听这一小段">▶</button>
              <button class="chip icon" data-set="B" title="把播放头所在处挪到这里">•</button>
            </div>
          </div>
        </div>
        <div class="refmeta"><span class="hint" id="hintLane"></span></div>
        <div style="margin-top:9px">
          <button class="primary" id="btnGen2" disabled>
            <span class="pfill" id="gen2Fill"></span>
            <span class="ptxt" id="gen2Txt">合成成品</span>
          </button>
        </div>
        <div class="why" id="gen2Why"></div>
      </div>
    </div>
  </div>

  <div class="status" id="st"></div>

  <div class="footrow" style="margin-top:16px;text-align:center">
    <button class="link" id="btnOv">看看浮层(overlay)长什么样</button>
    <button class="link" id="btnSw">看看独立窗口(standaloneWindow)长什么样</button>
  </div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var API = "http://127.0.0.1:8733";
  var st = {
    pos: 0, dur: 0, file: "", path: "", a: null, b: null, c: null,
    backend: false, job: null, msg: "", notice: null, result: null,
    stageProgress: 0,
    // 插件推来的区间播放状态；playRole 是本地记的「最后按的是哪条轴的播放键」
    playing: false, prange: null, playRole: null,
  };

  function fmt(s) {
    if (s === null || s === undefined || isNaN(s)) return "--:--";
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var mm = (h > 0) ? String(m).padStart(2, "0") : String(m);
    return (h > 0 ? h + ":" : "") + mm + ":" + String(x).padStart(2, "0");
  }

  // 打点要能落在毫秒上，只显示到秒就没法判断自己打在哪儿
  function fmtMs(s) {
    if (s === null || s === undefined || isNaN(s)) return "--";
    return fmt(s) + "." + String(Math.floor((s % 1) * 1000)).padStart(3, "0");
  }

  el("speed").oninput = function (e) {
    el("speed-v").textContent = (+e.target.value).toFixed(2);
  };

  function post(p, body) {
    return fetch(API + p, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); });
  }

  /*
   * 官方消息桥。IINA 在文档创建时就把 window.iina 注入进插件页面
   * （postMessage 走 webkit.messageHandlers.iina，onMessage 收插件推来的消息），
   * 插件侧对应的就是 iina.sidebar.postMessage / onMessage —— 即时双向，不用轮询。
   */
  /*
   * 即便 window.iina 存在，也不能假定这条通路一定送得过来 —— 插件侧如果没接住
   * （例如注册监听的时机被 loadFile 清掉），这里就会一直收不到状态。
   * 所以 useBridge 是可降级的：收不到东西就把它关掉，退回轮询。
   */
  var bridge = (window.iina && typeof window.iina.postMessage === "function") ? window.iina : null;
  var useBridge = !!bridge;
  var gotState = false;
  var polling = false;

  // 面板 → 插件。桥不通时，这些指令改写成旧的会话字段，让插件轮询取走
  var LEGACY = {
    setMark: function (d) { var p = {}; p[d.role] = d.t; return { marks: p }; },
    setMarkAt: function (d) { var p = {}; p[d.role] = d.t; return { marks: p }; },
    clearMarks: function () { return { marks: { a: null, b: null, c: null } }; },
    preview: function () { return { want_preview: true }; },
    // 没有桥就做不到「播一段自动停」，退到区间开头算了，剩下的交给用户按空格
    playRange: function (d) { return { want_goto: d.from }; },
    stop: function () { return { want_pause_toggle: true }; },
    goto: function (d) { return { want_goto: d.t }; },
    toggle: function () { return { want_pause_toggle: true }; },
  };

  function send(cmd, data) {
    if (useBridge) { bridge.postMessage("cmd", { cmd: cmd, data: data || {} }); return; }
    var f = LEGACY[cmd];
    if (f) post("/api/session", f(data || {})).catch(function () {});
  }

  function applyState(d) {
    gotState = true;
    if (d.pos !== undefined) st.pos = d.pos;
    if (d.dur !== undefined) st.dur = d.dur;
    if (d.playing !== undefined) {
      st.playing = !!d.playing;
      st.prange = d.prange || null;
      if (!st.playing) st.playRole = null;   // 播完了，按钮复位
    }
    if (d.name || d.path) {
      if (d.path && d.path !== st.path) PEAKS = { a: null, b: null, c: null };
      st.file = d.name || d.path; st.path = d.path || "";
    }
    // 拖动期间不能让插件推来的 marks 覆盖本地 —— 插件那边的打点要到松手才更新，
    // 它每轮推的还是旧值，照单全收的话拖到一半会被打回去
    if (d.marks && !dragging) { st.a = d.marks.a; st.b = d.marks.b; st.c = d.marks.c; }
    paint();
  }

  /*
   * 焦点。这块面板是播放器侧栏里的一个 WKWebView：它拿到 first responder 之后，
   * 空格就落进网页而不是播放器，表现是「敲空格没反应」。IINA 只在窗口重新变成
   * key window 时把焦点收回去，所以这里自己留两条退路 ——
   * Esc 或点面板空白处就交出焦点；焦点还停在面板里（但不在输入框）时，
   * 空格转发给播放器去暂停。
   */
  function isTyping() {
    var a = document.activeElement;
    return !!a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT");
  }
  function handBackFocus() {
    var a = document.activeElement;
    if (a && a.blur) a.blur();
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { handBackFocus(); return; }
    if (e.key === " " && !isTyping()) {
      e.preventDefault();          // 别让网页把这一下当成滚动
      send("toggle");
    }
  });
  document.addEventListener("mousedown", function (e) {
    if (isTyping() && e.target && !e.target.closest("input, textarea, button, a, select")) {
      handBackFocus();
    }
  });

  // 桥通了就不用轮询：插件把状态直接推过来。桥不通才退回旧办法 ——
  // 插件把状态写进后端会话，面板到这里取。
  function poll() {
    return fetch(API + "/api/session")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        st.backend = true;
        applyState(d);
        // 插件不能在自己的 http 回调里弹提示（那个回调跑在后台队列，碰 AppKit
        // 会让播放器 abort），这类提示寄存在会话里，由面板代显示。
        st.notice = (d.notice && Date.now() / 1000 - d.notice.at < 6) ? d.notice : null;
        paint();
      })
      .catch(function () { st.backend = false; paint(); });
  }

  // 桥只管播放器这一侧；后端是否还活着（合成要走它）得自己问一次。
  // 没连上才慢慢重试，别刷屏
  function probeBackend() {
    fetch(API + "/api/session")
      .then(function (r) { return r.json(); })
      .then(function () { st.backend = true; paint(); })
      .catch(function () { st.backend = false; paint(); });
  }

  function startPolling(why) {
    if (polling) return;
    polling = true;
    if (why) { st.msg = why; paint(); }
    setInterval(poll, 400);
    poll();
  }

  if (useBridge) {
    bridge.onMessage("state", applyState);
    bridge.onMessage("marks", function (d) { st.a = d.a; st.b = d.b; st.c = d.c; paint(); });
    bridge.onMessage("notice", function (d) {
      st.notice = (d && Date.now() / 1000 - d.at < 6) ? d : null;
      paint();
    });
    bridge.postMessage("ui-ready", {});
    probeBackend();
    setInterval(function () { if (!st.backend) probeBackend(); }, 3000);
    // 看门狗：桥在，但插件侧一直没把状态送过来（多半是它没接住消息），
    // 那就别干等，退回轮询让面板照常能用
    setTimeout(function () {
      if (!gotState) { useBridge = false; startPolling("插件未推送状态，已改用轮询"); }
    }, 2500);
  } else {
    startPolling();
  }

  function setMark(role) {
    send("setMark", { role: role, t: st.pos });
  }

  function clearMarks() {
    send("clearMarks");
  }

  /* 提示只在没做过的时候说一遍。做过了就永远不提 ——
     常驻的说明是从说明书里搬来的，它会让人以为有件事一直没交代完。 */
  function seenTip(k) {
    try { return localStorage.getItem("bcb.tip." + k); } catch (e) { return null; }
  }
  function rememberTip(k) {
    try { localStorage.setItem("bcb.tip." + k, "1"); } catch (e) { /* file:// 下可能不可用 */ }
  }

  /* ---------- 波形轨道 ----------
   *
   * 一个点一条轴，各自以自己的打点为中心画同一段波形。
   * 中间那条固定的竖线才是打点的位置：把波形往右拖，等于让竖线指向更早的内容，
   * 也就是把打点往前挪。
   *
   * 波形不是整轨压成的粗粒度概览 —— 那样放大到秒级以下就糊了。这里只向后端
   * 要「打点附近一小段、固定毫秒级格宽」的波形，长片也一样快。
   */

  var LANE_HALF = 0.5;                      // 轴永远只看这个宽度：精细这一件事归它管
  var PEAKS = { a: null, b: null, c: null };
  var pending = { a: false, b: false, c: false };
  var dragging = null;
  var CSSV = {};
  var LANE_H = 48;

  function readCss() {
    var s = getComputedStyle(document.documentElement);
    ["--bread", "--brand", "--muted", "--text"].forEach(function (n) {
      CSSV[n] = s.getPropertyValue(n).trim();
    });
  }
  function half() { return LANE_HALF; }

  /** 打点不能越过邻居，也不能出界 —— 拖到底就停在那儿，不让它错位。 */
  function clampMark(role, t) {
    // 时长还没拿到时先放开上界，否则会把 C 一路钳到 0
    var lo = 0, hi = (st.dur > 0) ? st.dur : Infinity;
    if (role === "a") {
      hi = (st.b !== null ? st.b : (st.c !== null ? st.c : hi)) - 0.001;
    } else if (role === "b") {
      lo = (st.a !== null ? st.a : 0) + 0.001;
      hi = (st.c !== null ? st.c : hi) - 0.001;
    } else {
      lo = (st.b !== null ? st.b : (st.a !== null ? st.a : 0)) + 0.001;
    }
    if (hi < lo) hi = lo;
    return Math.min(Math.max(t, Math.max(0, lo)), hi);
  }

  function peaksFresh(role) {
    var p = PEAKS[role], t = st[role];
    if (!p || !p.peaks || t === null) return false;
    // 留出两倍窗口的余量，拖动时不至于每动一下就要重新解码
    var margin = half() * 2;
    return t - margin >= p.t0 && t + margin <= p.t0 + p.span;
  }

  function ensurePeaks(role) {
    var t = st[role];
    if (t === null || !st.path) { PEAKS[role] = null; return; }
    if (peaksFresh(role) || pending[role]) return;
    pending[role] = true;
    var span = Math.min(60, Math.max(4, half() * 12));
    fetch(API + "/api/peaks?path=" + encodeURIComponent(st.path) +
          "&center=" + t + "&span=" + span)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        pending[role] = false;
        if (d && d.peaks) { PEAKS[role] = d; drawLane(role); }
      })
      .catch(function () { pending[role] = false; });
  }

  function drawLane(role) {
    var cv = el("lc" + role.toUpperCase());
    if (!cv || !cv.getContext) return;
    var w = cv.clientWidth || 240;
    if (!w) return;                       // 折叠起来的轴不用画
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(LANE_H * dpr);
    }
    var g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, LANE_H);

    var t = st[role], p = PEAKS[role];
    g.font = '11px -apple-system, "PingFang SC", sans-serif';
    g.textAlign = "center";
    if (t === null) {
      g.fillStyle = CSSV["--muted"] || "#888";
      g.fillText("框好之后，可以在这里拖着微调", w / 2, LANE_H / 2 + 4);
      return;
    }
    if (p && p.peaks && p.peaks.length) {
      var t0 = t - half(), n = p.peaks.length;
      g.fillStyle = (role === "b") ? (CSSV["--brand"] || "#cf9413")
                                   : (CSSV["--bread"] || "#8a6a3d");
      for (var x = 0; x < w; x++) {
        var ta = t0 + (x / w) * half() * 2;
        var tb = t0 + ((x + 1) / w) * half() * 2;
        var i0 = Math.floor((ta - p.t0) / p.res);
        var i1 = Math.ceil((tb - p.t0) / p.res);
        if (i1 <= i0) i1 = i0 + 1;
        if (i0 < 0) i0 = 0;
        if (i1 > n) i1 = n;
        if (i0 >= n) continue;
        var v = 0;
        for (var i = i0; i < i1; i++) { if (p.peaks[i] > v) v = p.peaks[i]; }
        var bh = Math.max(1, v * (LANE_H - 8));
        g.fillRect(x, (LANE_H - bh) / 2, 1, bh);
      }
    } else {
      g.fillStyle = CSSV["--muted"] || "#888";
      g.fillText("波形读取中…", w / 2, LANE_H / 2 + 4);
    }
    // 中线：这一条才是打点所在的位置
    g.fillStyle = CSSV["--brand"] || "#cf9413";
    g.fillRect(Math.round(w / 2) - 0.75, 0, 1.5, LANE_H);

    drawPlayhead(g, w, t - half(), t + half());
  }

  /**
   * 播放头。轴能看见的只有 [t0, t1] 这一小段，播放头落在里面就画一条随播移动的
   * 竖线（带三角，好跟中间那条固定的打点竖线区分）；落到窗外只在边缘画个箭头 ——
   * 播 A→C 那种长区间时，播放头多半已经扫出视野了。
   */
  function drawPlayhead(g, w, t0, t1) {
    var head = CSSV["--text"] || "#1d1b18";
    var span = t1 - t0;
    if (st.pos >= t0 && st.pos <= t1) {
      var px = ((st.pos - t0) / span) * w;
      g.fillStyle = head;
      g.fillRect(px - 0.5, 0, 1, LANE_H);
      g.beginPath();
      g.moveTo(px - 3.5, 0); g.lineTo(px + 3.5, 0); g.lineTo(px, 5.5);
      g.closePath(); g.fill();
      return;
    }
    if (!st.playing) return;
    var right = st.pos > t1;
    var ex = right ? w - 5 : 5;
    g.fillStyle = head;
    g.beginPath();
    if (right) { g.moveTo(ex + 4, LANE_H - 8); g.lineTo(ex + 4, LANE_H - 2); g.lineTo(ex, LANE_H - 5); }
    else { g.moveTo(ex - 4, LANE_H - 8); g.lineTo(ex - 4, LANE_H - 2); g.lineTo(ex, LANE_H - 5); }
    g.closePath(); g.fill();
  }

  /**
   * 播一条轴。播的就是这条轴上能看见的那一小段（± 波形宽度），
   * 所以播放头一定会在视野里从左扫到右 —— 微调时听得见也看得见。
   */
  function playLane(role) {
    var h = half();
    stopNarration();
    send("playRange", {
      from: Math.max(0, st[role] - h), to: st[role] + h,
      label: role.toUpperCase() + " 附近 ±" + h.toFixed(2) + "s",
    });
    if (useBridge) {
      // 插件要下一轮才把 playing 推回来，这里先乐观地切一下，别让按钮慢半拍
      st.playing = true;
      st.playRole = role;
      st.prange = { from: Math.max(0, st[role] - h), to: st[role] + h };
    } else {
      st.msg = "已跳到这一段开头（没走官方桥时不会自动停）";
    }
    paint();
  }

  document.querySelectorAll("[data-play]").forEach(function (b) {
    b.addEventListener("click", function () {
      var role = b.getAttribute("data-play");
      if (st[role] === null) { st.msg = "先打上这个点，才能听它附近"; paint(); return; }
      if (st.playing && st.playRole === role) {   // 再点一次就是停
        send("stop");
        st.playing = false; st.playRole = null; st.prange = null;
        paint();
        return;
      }
      playLane(role);
    });
  });

  function refreshLanes() {
    ["a", "b", "c"].forEach(function (role) {
      var v = el("lv" + role.toUpperCase());
      v.textContent = (st[role] === null) ? (role === "b" ? "未定点" : "未取样") : fmtMs(st[role]);
      v.className = "cv" + (st[role] === null ? " unset" : "");
      ensurePeaks(role);
      drawLane(role);
    });
  }

  ["a", "b", "c"].forEach(function (role) {
    var cv = el("lc" + role.toUpperCase());
    var startX = 0, startT = 0, moved = false;

    cv.addEventListener("pointerdown", function (e) {
      if (st[role] === null) return;
      dragging = role;
      startX = e.clientX;
      startT = st[role];
      moved = false;
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      e.preventDefault();
    });

    cv.addEventListener("pointermove", function (e) {
      if (dragging !== role) return;
      var w = cv.clientWidth || 240;
      if (Math.abs(e.clientX - startX) > 1) moved = true;
      // 波形往右拖 → 竖线指向更早的内容 → 打点往前挪
      var dt = (e.clientX - startX) / w * half() * 2;
      st[role] = clampMark(role, startT - dt);
      paint();          // paint 末尾会顺带刷新三条轨道
    });

    // 松手才落库：拖动过程中一直往插件发消息既吵，也会让播放器不停跳转
    cv.addEventListener("pointerup", function (e) {
      if (dragging !== role) return;
      dragging = null;
      try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      if (!moved) return;
      send("setMarkAt", { role: role, t: st[role] });
      rememberTip("lane");
      if (st.playing && st.playRole === role) {
        playLane(role);   // 边听边挪：松手就接着从新位置播，不必再点一次
      } else {
        send("goto", { t: st[role] });   // 跳过去听一下，确认落在哪个字前面
      }
      ensurePeaks(role);
    });
    cv.addEventListener("pointercancel", function () { dragging = null; });
  });


  /**
   * 参考条。整片的进度不用在面板里再画一条（播放器自己就有），
   * 但「旁白要照着来的那一段」值得单独一条：常驻着，没打点时是空骨架，
   * 打齐了就在里面画出 A→C，B 的位置也标在上面。
   */
  /* ---------- 取样条 ----------
   *
   * 取样在这儿只用一个手势：拖一下，框出一段。
   *
   * 没有「Alt+A 打起点 → 换个精度档 → 拖轴微调 → Alt+S 打终点 → 再调 → 点试听」
   * 这条路了。那些是系统给自己加的工序，不是用户要做的决定。
   * 视图该显示多宽也不用人事先选：有选区时自动聚焦到选区（两端留余量），
   * 没选区时跟着播放头走 —— 要取样，你多半正在听那儿。原来那个「波形宽度」
   * 滑块就是为这同一个视图要同时服务「看全貌」和「看毫秒」的冲突打的补丁，
   * 现在这两个目的分给了两个视图，补丁就可以不要了。
   */

  var OV = null;                 // 取样条此刻显示的这一段波形
  var ovPending = false;
  var OV_MAX = 60;               // 一次最多取这么长
  var dragOv = null;             // 拖动手势：在哪儿按下、此刻是哪种手势

  /** 这条条此刻显示的是哪一段时间 */
  function viewOf() {
    var dur = (st.dur > 0) ? st.dur : 0;
    // 拖动过程中视图必须钉住：一边拖一边缩放，手会完全找不到位置
    if (dragOv && dragOv.view) return dragOv.view;
    if (st.a !== null && st.c !== null && st.c > st.a) {
      var pad = Math.max(0.6, (st.c - st.a) * 0.12);
      var hi = (dur > 0) ? dur : (st.c + pad);
      var t0 = Math.max(0, st.a - pad), t1 = Math.min(hi, st.c + pad);
      if (t1 - t0 < 0.2) t1 = t0 + 0.2;
      return { t0: t0, t1: t1 };
    }
    if (dur > 0 && dur <= OV_MAX) return { t0: 0, t1: dur };
    var hsp = OV_MAX / 2;
    var c = (dur > OV_MAX) ? Math.max(hsp, Math.min(dur - hsp, st.pos)) : hsp;
    return { t0: Math.max(0, c - hsp), t1: Math.min(dur || OV_MAX, c + hsp) };
  }

  function ensureOverview() {
    if (!st.path) { OV = null; return; }
    var v = viewOf();
    var span = v.t1 - v.t0;
    if (span <= 0) return;
    // 手上这段已经盖住了要显示的区间就别再要一次，来回拖的时候这点很重要
    if (OV && OV.t0 <= v.t0 + 0.05 && OV.t0 + OV.span >= v.t1 - 0.05) { drawOverview(); return; }
    if (ovPending) return;
    ovPending = true;
    fetch(API + "/api/peaks?path=" + encodeURIComponent(st.path) +
          "&center=" + ((v.t0 + v.t1) / 2) + "&span=" + Math.min(OV_MAX, span))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        ovPending = false;
        if (d && d.peaks) { OV = d; drawOverview(); }
      })
      .catch(function () { ovPending = false; });
  }

  function drawOverview() {
    var cv = el("ov");
    if (!cv || !cv.getContext) return;
    var w = cv.clientWidth || 240, h = 34;
    if (!w) return;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    var g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    var v = viewOf(), p = OV;
    if (!p || !p.peaks || !p.peaks.length) return;
    var has = st.a !== null && st.c !== null && st.c > st.a;
    var plain = CSSV["--muted"] || "#888";
    var lit = CSSV["--brand"] || "#0a84ff";
    for (var x = 0; x < w; x++) {
      var ta = v.t0 + (x / w) * (v.t1 - v.t0);
      var tb = v.t0 + ((x + 1) / w) * (v.t1 - v.t0);
      var i0 = Math.floor((ta - p.t0) / p.res), i1 = Math.ceil((tb - p.t0) / p.res);
      if (i1 <= i0) i1 = i0 + 1;
      if (i0 < 0) i0 = 0;
      if (i1 > p.peaks.length) i1 = p.peaks.length;
      if (i0 >= p.peaks.length) continue;
      var val = 0;
      for (var i = i0; i < i1; i++) { if (p.peaks[i] > val) val = p.peaks[i]; }
      // 框里的是被选中的内容，画得实；框外是背景，压暗
      var isSel = has && ta >= st.a && ta <= st.c;
      g.fillStyle = isSel ? lit : plain;
      var bh = Math.max(1, val * (h - 10));
      g.fillRect(x, (h - bh) / 2, 1, bh);
    }
  }

  function paintRefbar() {
    var ok = st.a !== null && st.c !== null && st.c > st.a;
    var bar = el("refbar");
    bar.className = "range" + (ok ? "" : " blank");
    el("refEmpty").style.display = ok ? "none" : "flex";
    el("refFill").style.display = ok ? "block" : "none";
    el("refEdgeA").style.display = ok ? "block" : "none";
    el("refEdgeC").style.display = ok ? "block" : "none";
    el("hintRange").textContent = seenTip("range") ? "" : "拖一下就框出一段";
    el("hintLane").textContent = seenTip("lane") ? "" : "要更准，就在下面两条上拖";
    ensureOverview();
    if (!ok) {
      el("rbLen").textContent = "";
      el("rbB").style.display = "none";
      el("rhead").style.display = "none";
      return;
    }
    var v = viewOf();
    var at = function (t) { return (((t - v.t0) / (v.t1 - v.t0)) * 100) + "%"; };
    el("refFill").style.left = at(st.a);
    el("refFill").style.width = (((st.c - st.a) / (v.t1 - v.t0)) * 100) + "%";
    el("refEdgeA").style.left = at(st.a);
    el("refEdgeC").style.left = at(st.c);

    var hasB = st.b !== null && st.b > st.a && st.b < st.c;
    el("rbB").style.display = hasB ? "block" : "none";
    if (hasB) el("rbB").style.left = at(st.b);

    // 播放头落在这一段里才画：它说的始终是条上这一小段的事
    var inView = st.pos >= v.t0 && st.pos <= v.t1;
    el("rhead").style.display = inView ? "block" : "none";
    if (inView) el("rhead").style.left = at(st.pos);

    el("rbLen").textContent = "取样 " + (st.c - st.a).toFixed(2) + " 秒" +
      (hasB ? " · 插在 " + (st.b - st.a).toFixed(2) + "s" : "");
  }

  /* 手势：pointerdown 一落下去就定了性 ——
     落在把手上是改边界，落在框里是整段挪，落在框外是重新框。
     抬起来发现哪儿都没动，那就算点了一下：跳过去听。 */
  var ovCv = el("ov");

  function ovRect() {
    return (ovCv.getBoundingClientRect && ovCv.getBoundingClientRect()) ||
           { left: 0, width: ovCv.clientWidth || 240 };
  }
  function ovTime(e) {
    var v = viewOf(), r = ovRect();
    var f = Math.min(1, Math.max(0, (e.clientX - (r.left || 0)) / (r.width || 1)));
    return v.t0 + f * (v.t1 - v.t0);
  }

  ovCv.addEventListener("pointerdown", function (e) {
    if (!st.path) return;
    var has = st.a !== null && st.c !== null && st.c > st.a;
    var t = ovTime(e);
    var v = viewOf();
    var tol = (10 / (ovCv.clientWidth || 240)) * (v.t1 - v.t0);
    var mode = "new";
    if (has) {
      if (Math.abs(t - st.a) <= tol) mode = "a";
      else if (Math.abs(t - st.c) <= tol) mode = "c";
      else if (t > st.a && t < st.c) mode = "move";
    }
    dragOv = { mode: mode, startT: t, lastT: t, moved: false, view: v, a0: st.a, c0: st.c };
    if (mode === "new") { st.a = t; st.c = t; }   // 零宽起步，拖到哪儿就框到哪儿
    try { ovCv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    e.preventDefault();
  });

  ovCv.addEventListener("pointermove", function (e) {
    if (!dragOv) return;
    var t = ovTime(e);
    if (Math.abs(t - dragOv.startT) > 0.01) dragOv.moved = true;
    dragOv.lastT = t;
    var v = viewOf();
    var lo = Math.max(0, v.t0);
    var hi = Math.min((st.dur > 0 ? st.dur : Infinity), v.t1);
    function cl(x) { return Math.min(Math.max(x, lo), hi); }

    if (dragOv.mode === "a") {
      st.a = cl(t);
      if (st.a > st.c) { var swap = st.a; st.a = st.c; st.c = swap; dragOv.mode = "c"; }
    } else if (dragOv.mode === "c") {
      st.c = cl(t);
      if (st.c < st.a) { var swap2 = st.c; st.c = st.a; st.a = swap2; dragOv.mode = "a"; }
    } else if (dragOv.mode === "move") {
      var len = dragOv.c0 - dragOv.a0;
      var na = Math.max(lo, Math.min(hi - len, dragOv.a0 + (t - dragOv.startT)));
      st.a = na; st.c = na + len;
    } else {
      st.a = Math.min(dragOv.startT, t);
      st.c = Math.max(dragOv.startT, t);
    }
    paint();
  });

  function endOvDrag() {
    if (!dragOv) return;
    var d = dragOv;
    dragOv = null;
    if (!d.moved) {
      // 没挪过就是点了一下：跳过去听，选区别乱动
      st.a = d.a0; st.c = d.c0;
      st.pos = d.lastT;
      send("goto", { t: d.lastT });
      paint();
      return;
    }
    rememberTip("range");
    // 只把真正动过的那一端交出去，别为了省事两边都发一遍
    if (st.a !== null && st.a !== d.a0) send("setMarkAt", { role: "a", t: st.a });
    if (st.c !== null && st.c !== d.c0) send("setMarkAt", { role: "c", t: st.c });
    // 松手就把播放器挪到刚动过的那一端：手指定到哪儿听到哪儿，
    // 不用为了确认而专门去点「听这一段」
    var focus = (d.mode === "a" || d.mode === "new") ? st.a : st.c;
    st.pos = focus;
    send("goto", { t: focus });
    paint();
  }
  ovCv.addEventListener("pointerup", endOvDrag);
  ovCv.addEventListener("pointercancel", endOvDrag);

  /* ---------- 旁白播放：合成出来的那一段由网页自己播 ----------
   * 参考监听的是原声，得交给播放器；旁白是面板自己产出的文件，
   * 用 audio 元素播最直接 —— 它有独立的进度，能反复听这一句到底像不像。
   */
  var nar = el("narAudio");

  function narStopUi() {
    el("btnNarPlay").textContent = "▶";
    el("btnNarPlay").className = "playBig";
  }
  function stopNarration() {
    if (nar && !nar.paused) { nar.pause(); nar.currentTime = 0; }
    narStopUi();
    paintNarProgress();
  }
  function paintNarProgress() {
    var d = nar.duration;
    if (!d || isNaN(d)) { el("narFill").style.width = "0%"; return; }
    el("narFill").style.width = ((nar.currentTime / d) * 100) + "%";
    el("narTime").textContent = fmt(nar.currentTime) + " / " + fmt(d);
  }
  nar.addEventListener("timeupdate", paintNarProgress);
  nar.addEventListener("loadedmetadata", paintNarProgress);
  nar.addEventListener("ended", function () { narStopUi(); paintNarProgress(); });
  nar.addEventListener("play", function () {
    el("btnNarPlay").textContent = "■";
    el("btnNarPlay").className = "playBig on";
  });
  el("btnNarPlay").addEventListener("click", function () {
    if (!nar.src) return;
    if (!nar.paused) { nar.pause(); narStopUi(); return; }
    // 别让播放器里的原声和旁白叠在一起
    if (st.playing) { send("stop"); st.playing = false; st.playRole = null; st.prange = null; }
    nar.play().catch(function () { st.msg = "这一段播不出来"; paint(); });
    paint();
  });
  el("narTrack").addEventListener("click", function (e) {
    var d = nar.duration;
    if (!d || isNaN(d)) return;
    var box = el("narTrack");
    var r = (box.getBoundingClientRect && box.getBoundingClientRect()) ||
            { left: 0, width: box.clientWidth || 0 };
    var f = Math.min(1, Math.max(0, (e.clientX - (r.left || 0)) / (r.width || 1)));
    nar.currentTime = f * d;
    paintNarProgress();
  });

  function paintQc(res) {
    var q = res && res.qc;
    if (!q || q.error || q.similarity === undefined) {
      el("qcBox").style.display = "none";
      return;
    }
    el("qcBox").style.display = "block";
    var v = Math.round(q.similarity * 1000) / 10;
    var s = el("qcSim");
    s.textContent = v.toFixed(1) + "%";
    s.className = "qcSim " + (v >= 95 ? "good" : (v >= 85 ? "mid" : "low"));
    el("qcCnt").textContent = (q.diff_count ? q.diff_count + " 处不一致" :
                               (typeof q.diff_count === "number" ? "逐字一致" : ""));
    el("qcAsr").textContent = q.asr_text || "";
  }

  /**
   * mode = "narration" 只合成旁白（不切面包、不拼接）；
   * mode = "sandwich" 才是把旁白夹回 A→B、B→C 之间。两者共用同一条流水线，
   * 差别只在后端要不要继续做下去。
   *
   * 界面上是同一条路：先合成旁白，听完决定要不要插回去。
   */
  function run(mode) {
    if (!st.path) { st.msg = "先在播放器里打开一个文件"; paint(); return; }
    st.result = null;
    st.jobPending = true;
    st.msg = "正在读取素材…";
    stopNarration();
    paint();
    var narOnly = (mode === "narration");

    post("/api/open", { path: st.path })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error || "打不开这个文件");
        st.job = r.id;
        st.msg = "正在合成，第一次要约一分钟…";
        paint();
        return post("/api/job/" + r.id + "/generate", {
          a: st.a, b: st.b, c: st.c,
          text: el("text").value.trim(),
          mode: mode, speed: +el("speed").value || 1.0,
          auto_ref: true, pace: false, unify_loudness: false, qc: true,
        });
      })
      .then(function () {
        var tick = setInterval(function () {
          fetch(API + "/api/job/" + st.job)
            .then(function (r) { return r.json(); })
            .then(function (j) {
              st.msg = j.message || j.stage;
              st.stageProgress = (typeof j.progress === "number") ? j.progress : 0;
              paint();
              if (j.stage === "done" || j.stage === "error") {
                clearInterval(tick);
                st.job = null;
                st.stageProgress = 0;
                if (j.stage === "done") {
                  st.result = j.result || null;
                  if (st.result && st.result.narration) {
                    nar.src = API + st.result.narration;
                    nar.load();
                  }
                  st.msg = (st.result && st.result.mode === "narration")
                    ? "听着行就往下"
                    : "成品已生成，就在下方";
                  var pc = st.result && st.result.pace;
                  if (pc && pc.reason) st.msg = "语速对齐：" + pc.reason + "。" + st.msg;
                } else {
                  st.result = null;
                  st.msg = "出错：" + (j.error || "未知原因");
                }
                paint();
              }
            })
            .catch(function () {});
        }, 700);
      })
      .catch(function (e) {
        st.job = null;
        st.stageProgress = 0;
        st.msg = "失败：" + (e.message || e);
        paint();
      });
  }

  /** 差什么就说明白，别让用户对着一个灰按钮猜。 */
  function missing() {
    var m = [];
    if (!st.backend) m.push("本机服务（没起来就跑 ./run.sh）");
    else if (!st.path) m.push("一个正在播放的文件");
    if (!(st.a !== null && st.c !== null && st.c > st.a)) m.push("取样区间 A→C");
    if (!el("text").value.trim()) m.push("一句旁白");
    return m;
  }
  function missingStitch() {
    if (!st.result) return "先把旁白合成出来";
    if (st.b === null) return "打上插入点 B：旁白会从这里插进去";
    if (!(st.a < st.b && st.b < st.c)) return "B 要落在 A 和 C 之间";
    return "";
  }

  function paint() {
    el("file").textContent = st.file || "未在播放";
    el("file").title = st.file || "";
    el("pos").textContent = fmt(st.pos);
    el("dur").textContent = fmt(st.dur);
    el("dot").className = "dot " + (st.backend ? "on" : "off");

    var busy = !!st.job;
    var m = missing();
    var canGen = !busy && m.length === 0;
    el("btnGen").disabled = !canGen;
    el("genTxt").textContent = busy ? (st.msg || "正在合成…")
                                    : (st.result ? "重录一次" : "合成旁白");
    el("tuneBox").className = st.result ? "slider tune show" : "slider tune";
    el("genFill").style.width = busy ? (st.stageProgress * 100) + "%" : "0%";
    el("genWhy").textContent = busy ? "" : (m.length ? "还需要：" + m.join("、")
                                                     : "会用 A→C 这一段的音色念出来");

    // 合成出来的东西都在第三步与第四步，没有结果就不占地方
    var has = !!st.result;
    el("g3").style.display = has ? "block" : "none";
    el("g4").style.display = has ? "block" : "none";
    if (has) {
      paintQc(st.result);
      var name = ((st.result.out_wav || "").split("/").pop()) || "";
      el("outName").textContent = name;
      el("outName").title = st.result.out_wav || "";
      var stitched = st.result.mode !== "narration";
      el("exitHead").textContent = stitched ? "成品" : "旁白 · 拿到剪辑软件里";
      el("exitNote").textContent = stitched ? "整段已经拼好" : "拖进你自己的时间线";
      el("exitStitch").style.display = stitched ? "none" : "block";

      var ms = missingStitch();
      el("btnGen2").disabled = !!ms;
      el("gen2Why").textContent = ms;
      el("gen2Fill").style.width = busy ? (st.stageProgress * 100) + "%" : "0%";
      el("gen2Txt").textContent = busy ? (st.msg || "正在合成…") : "合成成品";
    }

    // 哪条轴在播，就把它的键切成停止
    ["a", "b", "c"].forEach(function (k) {
      var pb = el("lp" + k.toUpperCase());
      var on = st.playing && st.playRole === k;
      pb.textContent = on ? "■" : "▶";
      pb.className = "chip icon" + (on ? " on" : "");
      pb.title = on ? "停止" : "听这一小段";
    });

    paintRefbar();

    if (st.notice) {
      el("st").textContent = st.notice.text;
      el("st").className = "status" + (st.notice.is_error ? " err" : "");
    } else {
      el("st").textContent = st.msg ||
        (st.backend ? "已连接本机服务" : "未连到本机服务（先跑 ./run.sh）");
      el("st").className = "status";
    }
    refreshLanes();
  }

  document.querySelectorAll("[data-set]").forEach(function (b) {
    b.addEventListener("click", function () {
      setMark(b.getAttribute("data-set").toLowerCase());
    });
  });
  el("btnReset").addEventListener("click", clearMarks);
  // 播放控制只能由插件做（面板拿不到 iina.core），这里只是下个指令
  el("btnPrev").addEventListener("click", function () {
    if (st.a === null || st.c === null) {
      st.msg = "先打上 A 和 C 才能试听";
      paint();
      return;
    }
    if (st.playing) {           // 正在播就先停下，不管播的是哪一段
      send("stop");
      st.playing = false; st.playRole = null; st.prange = null;
      st.msg = "已停止";
    } else {
      stopNarration();
      send("preview");
      st.playRole = null;
      st.msg = "正在播放 A→C，旁白会照这段的语气来";
    }
    paint();
  });

  el("btnStitchToggle").addEventListener("click", function () {
    var box = el("stitchBox");
    var open = box.style.display === "none";
    box.style.display = open ? "block" : "none";
    el("btnStitchToggle").textContent = open ? "收起" : "或者，就在这里插回去";
    if (open) {
      // 插入点默认就是播放头：旁白本来就该接在刚听过的那一处，
      // 不值得为它再记一个快捷键、再走一遍「打点 — 微调」
      if (st.b === null && st.a !== null && st.c !== null) {
        // 播放头多半正压在刚拖过的那一端上，插在端点上没有意义 —— 这时退到中间
        var atEnd = st.pos <= st.a + (st.c - st.a) * 0.05 ||
                    st.pos >= st.c - (st.c - st.a) * 0.05;
        var t = atEnd ? st.a + (st.c - st.a) / 2
                      : Math.max(st.a + 0.001, Math.min(st.c - 0.001, st.pos));
        st.b = t;
        send("setMarkAt", { role: "b", t: t });
      }
      ensurePeaks("b"); drawLane("b");
      paint();          // B 是这儿冒出来的，得当场画出来，不能等插件下一轮推
    }
  });

  el("text").addEventListener("input", paint);
  el("btnGen").addEventListener("click", function () { run("narration"); });
  el("btnGen2").addEventListener("click", function () { run("sandwich"); });
  var overlayOn = false;
  el("btnOv").addEventListener("click", function () {
    overlayOn = !overlayOn;
    send("previewOverlay", { on: overlayOn });
    el("btnOv").textContent = overlayOn ? "收起浮层预览" : "看看浮层(overlay)长什么样";
  });
  var swOn = false;
  el("btnSw").addEventListener("click", function () {
    swOn = !swOn;
    send("previewStandalone", { on: swOn });
    el("btnSw").textContent = swOn ? "收起独立窗口预览" : "看看独立窗口(standaloneWindow)长什么样";
  });
  el("btnReveal").addEventListener("click", function () {
    var p = st.result && (st.result.out_wav || st.result.out_dir);
    if (!p) return;
    post("/api/reveal", { path: p });
  });

  readCss();
  paint();
})();
</script>
</body>
</html>
