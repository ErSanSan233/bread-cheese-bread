<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两面包夹芝士</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f2f2f7;
    --border: rgba(60, 60, 67, 0.18);
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --accent: #d8893b;
    --accent-text: #ffffff;
    --bread: #9a7b4f;
    --cheese: #e0a458;
    --ok: #1d9e75;
    --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --surface: #2a2a2c;
      --border: rgba(255, 255, 255, 0.14);
      --text: #f2f2f7;
      --muted: #98989d;
      --accent: #e0a458;
      --accent-text: #2c1e08;
      --bread: #c8a97a;
      --cheese: #f0bf72;
      --ok: #35c79a;
      --bad: #e8736a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
  }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .file {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .clock {
    font: 500 20px/1.2 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: -.02em; margin-bottom: 10px;
  }
  .clock small { font-size: 12px; color: var(--muted); font-weight: 400; }

  .field { margin-bottom: 10px; }
  .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
  textarea {
    width: 100%; min-height: 62px; resize: vertical;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 8px; font: inherit; outline: none;
    -webkit-user-select: text;
  }
  textarea:focus { border-color: var(--accent); }

  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text);
    padding: 6px 10px;
  }
  button:active { opacity: .7; }
  button.primary {
    background: var(--accent); color: var(--accent-text);
    border-color: transparent; font-weight: 500; width: 100%; padding: 9px;
  }
  button.primary:disabled { opacity: .4; cursor: default; }
  button.tiny { padding: 3px 7px; font-size: 11px; }

  .marks { display: flex; gap: 6px; margin-bottom: 10px; }
  .mark {
    flex: 1; padding: 7px 6px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border); text-align: center;
  }
  .mark .k { font-size: 10px; color: var(--muted); display: block; }
  .mark .v {
    font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    display: block; margin: 1px 0 4px;
  }
  .mark.set { border-color: var(--accent); }
  .mark[data-role="A"] .v, .mark[data-role="C"] .v { color: var(--bread); }
  .mark[data-role="B"] .v { color: var(--cheese); }

  /* 三条微调轨道：同一段波形画三遍，各自以自己的打点为中心。
     中间那条固定的竖线才是打点的位置 —— 左右拖波形，就是把这个点挪到别处。 */
  .lanes { margin-bottom: 8px; }
  .lane { margin-bottom: 7px; }
  .laneHead {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 10px; color: var(--muted); margin-bottom: 3px;
  }
  .laneHead .k { font-weight: 600; font-size: 11px; }
  .laneHead .v {
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text);
  }
  .laneHead .hint { margin-left: auto; opacity: .8; }
  /* 轨道自己的播放键：播的就是这条轴上看到的那一小段 */
  .mini {
    padding: 0 6px; height: 18px; line-height: 16px; font-size: 10px;
    border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .mini.on { color: var(--accent); border-color: var(--accent); }
  .lane[data-role="A"] .k, .lane[data-role="C"] .k { color: var(--bread); }
  .lane[data-role="B"] .k { color: var(--cheese); }
  .lane canvas {
    display: block; width: 100%; height: 46px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; cursor: ew-resize; touch-action: none;
  }
  .zoom {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted); margin-bottom: 10px;
  }
  .zoom .label { margin: 0; }
  .zoom input[type=range] { flex: 1; accent-color: var(--accent); }
  .zoom .v {
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text); min-width: 46px; text-align: right;
  }

  .row { display: flex; gap: 6px; margin-bottom: 10px; }
  .row button { flex: 1; }

  /* A→C 试听条。整片进度没必要在面板里再画一条 —— 播放器自己就有。
     这里只关心旁白要照着来的那一段：播到哪儿、B 插在哪儿。 */
  .refwrap { margin-bottom: 10px; }
  .refbar {
    height: 22px; background: var(--surface); border-radius: 5px;
    position: relative; overflow: hidden; cursor: pointer;
    border: 1px solid var(--border);
  }
  .refbar.on { border-color: var(--accent); }
  .refbar .fill { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: var(--bread); opacity: .35; }
  .refbar .rb { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--cheese); }
  .refbar .rhead { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--text); }
  .refmeta {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 10px; color: var(--muted); margin-top: 3px;
  }
  .refmeta .v { font: 500 10px/1 ui-monospace, "SF Mono", Menlo, monospace; }

  .speed {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted);
  }
  .speed .label { margin: 0; }
  .speed input[type=range] { flex: 1; accent-color: var(--accent); }
  .speed .v {
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text); min-width: 32px; text-align: right;
  }

  .status {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
</style>
</head>
<body>
  <h1>两面包夹芝士</h1>
  <div class="file" id="file">未在播放</div>
  <div class="clock"><span id="pos">--:--</span><small id="dur"> / --:--</small></div>

  <div class="marks">
    <div class="mark" id="mA" data-role="A"><span class="k">A 面包起</span><span class="v">--</span><button class="tiny" data-set="A">打点</button></div>
    <div class="mark" id="mB" data-role="B"><span class="k">B 插入点</span><span class="v">--</span><button class="tiny" data-set="B">打点</button></div>
    <div class="mark" id="mC" data-role="C"><span class="k">C 面包终</span><span class="v">--</span><button class="tiny" data-set="C">打点</button></div>
  </div>

  <div class="refwrap" id="refWrap" style="display:none">
    <div class="refbar" id="refbar" title="点一下跳到该处">
      <div class="fill"></div>
      <div class="rb" id="rbB" style="display:none"></div>
      <div class="rhead" id="rhead" style="display:none"></div>
    </div>
    <div class="refmeta"><span id="rbA">A</span><span id="rbLen"></span><span id="rbC">C</span></div>
  </div>

  <div class="lanes">
    <div class="lane" data-role="A">
      <div class="laneHead"><span class="k">A 面包起</span><span class="v" id="lvA">未打点</span><button class="mini" id="lpA" data-play="a" title="播放这条轴上看到的这一小段">▶</button><span class="hint">拖波形微调</span></div>
      <canvas id="lcA"></canvas>
    </div>
    <div class="lane" data-role="B">
      <div class="laneHead"><span class="k">B 插入点</span><span class="v" id="lvB">未打点</span><button class="mini" id="lpB" data-play="b" title="播放这条轴上看到的这一小段">▶</button><span class="hint">拖波形微调</span></div>
      <canvas id="lcB"></canvas>
    </div>
    <div class="lane" data-role="C">
      <div class="laneHead"><span class="k">C 面包终</span><span class="v" id="lvC">未打点</span><button class="mini" id="lpC" data-play="c" title="播放这条轴上看到的这一小段">▶</button><span class="hint">拖波形微调</span></div>
      <canvas id="lcC"></canvas>
    </div>
  </div>

  <div class="zoom">
    <span class="label">波形宽度</span>
    <input type="range" id="zoom" min="0" max="5" step="1" value="2">
    <span class="v" id="zoom-v">±1.00s</span>
  </div>

  <div class="row">
    <button id="btnPrev">试听 Alt+P</button>
    <button id="btnReset">清空</button>
  </div>

  <div class="field">
    <span class="label">要补的旁白</span>
    <textarea id="text" placeholder="写下这段话，它会用片子里自己的声音说出来……"></textarea>
  </div>

  <div class="field speed">
    <span class="label">语速</span>
    <input type="range" id="speed" min="0.7" max="1.4" step="0.05" value="1.0">
    <span class="v" id="speed-v">1.00</span>
  </div>

  <!-- 两件事分开：先只合成旁白听一句，满意了再插回原声 -->
  <div class="row">
    <button id="btnNar" disabled title="只用 A→C 的音色念出来，不碰原声">只合成旁白</button>
    <button class="primary" id="btnGen" disabled title="切成 A→B + 旁白 + B→C">合成并插回去</button>
  </div>

  <div class="status"><span class="dot off" id="dot"></span><span id="st">正在连接</span></div>

  <!-- 生成完成后展开：给出成品的真实路径，并能直接在访达里选中 -->
  <div id="outBox" style="display:none;margin-top:8px;padding:8px 10px;
       border:1px solid var(--border);border-radius:8px;background:var(--surface)">
    <div id="outPath" style="font-size:11px;line-height:1.5;word-break:break-all;
         color:var(--muted);margin-bottom:6px"></div>
    <button id="btnReveal" style="font-size:12px;padding:4px 10px">在访达中显示</button>
  </div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var API = "http://127.0.0.1:8733";
  var st = {
    pos: 0, dur: 0, file: "", path: "", a: null, b: null, c: null,
    backend: false, job: null, msg: "", notice: null, result: null,
    // 插件推来的区间播放状态；playRole 是本地记的「最后按的是哪条轴的播放键」
    playing: false, prange: null, playRole: null,
  };

  function fmt(s) {
    if (s === null || s === undefined || isNaN(s)) return "--:--";
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var mm = (h > 0) ? String(m).padStart(2, "0") : String(m);
    return (h > 0 ? h + ":" : "") + mm + ":" + String(x).padStart(2, "0");
  }

  // 打点要能落在毫秒上，只显示到秒就没法判断自己打在哪儿
  function fmtMs(s) {
    if (s === null || s === undefined || isNaN(s)) return "--";
    return fmt(s) + "." + String(Math.floor((s % 1) * 1000)).padStart(3, "0");
  }

  el("speed").oninput = function (e) {
    el("speed-v").textContent = (+e.target.value).toFixed(2);
  };

  function post(p, body) {
    return fetch(API + p, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); });
  }

  /*
   * 官方消息桥。IINA 在文档创建时就把 window.iina 注入进插件页面
   * （postMessage 走 webkit.messageHandlers.iina，onMessage 收插件推来的消息），
   * 插件侧对应的就是 iina.sidebar.postMessage / onMessage —— 即时双向，不用轮询，
   * 也不必让后端在中间传话。能用就用，用不了才退回后端会话那一套。
   */
  /*
   * 即便 window.iina 存在，也不能假定这条通路一定送得过来 —— 插件侧如果没接住
   * （例如注册监听的时机被 loadFile 清掉），这里就会一直收不到状态。
   * 所以 useBridge 是可降级的：收不到东西就把它关掉，退回轮询。
   */
  var bridge = (window.iina && typeof window.iina.postMessage === "function") ? window.iina : null;
  var useBridge = !!bridge;
  var gotState = false;
  var polling = false;

  // 面板 → 插件。桥不通时，这些指令改写成旧的会话字段，让插件轮询取走
  var LEGACY = {
    setMark: function (d) { var p = {}; p[d.role] = d.t; return { marks: p }; },
    setMarkAt: function (d) { var p = {}; p[d.role] = d.t; return { marks: p }; },
    clearMarks: function () { return { marks: { a: null, b: null, c: null } }; },
    preview: function () { return { want_preview: true }; },
    // 没有桥就做不到「播一段自动停」，退到区间开头算了，剩下的交给用户按空格
    playRange: function (d) { return { want_goto: d.from }; },
    stop: function () { return { want_pause_toggle: true }; },
    goto: function (d) { return { want_goto: d.t }; },
    toggle: function () { return { want_pause_toggle: true }; },
  };

  function send(cmd, data) {
    if (useBridge) { bridge.postMessage("cmd", { cmd: cmd, data: data || {} }); return; }
    var f = LEGACY[cmd];
    if (f) post("/api/session", f(data || {})).catch(function () {});
  }

  function applyState(d) {
    gotState = true;
    if (d.pos !== undefined) st.pos = d.pos;
    if (d.dur !== undefined) st.dur = d.dur;
    if (d.playing !== undefined) {
      st.playing = !!d.playing;
      st.prange = d.prange || null;
      if (!st.playing) st.playRole = null;   // 播完了，按钮复位
    }
    if (d.name || d.path) {
      if (d.path && d.path !== st.path) PEAKS = { a: null, b: null, c: null };
      st.file = d.name || d.path; st.path = d.path || "";
    }
    // 拖动期间不能让插件推来的 marks 覆盖本地 —— 插件那边的打点要到松手才更新，
    // 它每轮推的还是旧值，照单全收的话拖到一半会被打回去
    if (d.marks && !dragging) { st.a = d.marks.a; st.b = d.marks.b; st.c = d.marks.c; }
    paint();
  }

  /*
   * 焦点。这块面板是播放器侧栏里的一个 WKWebView：它拿到 first responder 之后，
   * 空格就落进网页而不是播放器，表现是「敲空格没反应」。IINA 只在窗口重新变成
   * key window 时把焦点收回去，所以这里自己留两条退路 ——
   * Esc 或点面板空白处就交出焦点；焦点还停在面板里（但不在输入框）时，
   * 空格转发给播放器去暂停。
   */
  function isTyping() {
    var a = document.activeElement;
    return !!a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT");
  }
  function handBackFocus() {
    var a = document.activeElement;
    if (a && a.blur) a.blur();
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { handBackFocus(); return; }
    if (e.key === " " && !isTyping()) {
      e.preventDefault();          // 别让网页把这一下当成滚动
      send("toggle");
    }
  });
  document.addEventListener("mousedown", function (e) {
    if (isTyping() && e.target && !e.target.closest("input, textarea, button, a, select")) {
      handBackFocus();
    }
  });

  // 桥通了就不用轮询：插件把状态直接推过来。桥不通才退回旧办法 ——
  // 插件把状态写进后端会话，面板到这里取。
  function poll() {
    return fetch(API + "/api/session")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        st.backend = true;
        applyState(d);
        // 插件不能在自己的 http 回调里弹提示（那个回调跑在后台队列，碰 AppKit
        // 会让播放器 abort），这类提示寄存在会话里，由面板代显示。
        st.notice = (d.notice && Date.now() / 1000 - d.notice.at < 6) ? d.notice : null;
        paint();
      })
      .catch(function () { st.backend = false; paint(); });
  }

  // 桥只管播放器这一侧；后端是否还活着（合成要走它）得自己问一次。
  // 没连上才慢慢重试，别刷屏
  function probeBackend() {
    fetch(API + "/api/session")
      .then(function (r) { return r.json(); })
      .then(function () { st.backend = true; paint(); })
      .catch(function () { st.backend = false; paint(); });
  }

  function startPolling(why) {
    if (polling) return;
    polling = true;
    if (why) { st.msg = why; paint(); }
    setInterval(poll, 400);
    poll();
  }

  if (useBridge) {
    bridge.onMessage("state", applyState);
    bridge.onMessage("marks", function (d) { st.a = d.a; st.b = d.b; st.c = d.c; paint(); });
    bridge.onMessage("notice", function (d) {
      st.notice = (d && Date.now() / 1000 - d.at < 6) ? d : null;
      paint();
    });
    bridge.postMessage("ui-ready", {});
    probeBackend();
    setInterval(function () { if (!st.backend) probeBackend(); }, 3000);
    // 看门狗：桥在，但插件侧一直没把状态送过来（多半是它没接住消息），
    // 那就别干等，退回轮询让面板照常能用
    setTimeout(function () {
      if (!gotState) { useBridge = false; startPolling("插件未推送状态，已改用轮询"); }
    }, 2500);
  } else {
    startPolling();
  }

  function setMark(role) {
    send("setMark", { role: role, t: st.pos });
  }

  function clearMarks() {
    send("clearMarks");
  }

  /**
   * mode = "narration" 只合成旁白（不切面包、不拼接）；
   * mode = "sandwich" 才是完整的两面包夹芝士。两者共用同一条流水线，
   * 差别只在后端要不要继续做下去。
   */
  function run(mode) {
    if (!st.path) { st.msg = "先在播放器里打开一个文件"; paint(); return; }
    el("btnGen").disabled = true;
    el("btnNar").disabled = true;
    st.result = null;
    st.msg = "正在读取素材…";
    paint();
    var narOnly = (mode === "narration");

    post("/api/open", { path: st.path })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error || "打不开这个文件");
        st.job = r.id;
        st.msg = narOnly ? "正在合成旁白，第一次要约一分钟…"
                         : "正在合成，第一次要约一分钟…";
        paint();
        return post("/api/job/" + r.id + "/generate", {
          a: st.a, b: st.b, c: st.c,
          text: el("text").value.trim(),
          mode: mode, speed: +el("speed").value || 1.0,
          auto_ref: true, pace: false, unify_loudness: false, qc: true,
        });
      })
      .then(function () {
        var tick = setInterval(function () {
          fetch(API + "/api/job/" + st.job)
            .then(function (r) { return r.json(); })
            .then(function (j) {
              st.msg = j.message || j.stage;
              paint();
              if (j.stage === "done" || j.stage === "error") {
                clearInterval(tick);
                st.job = null;
                if (j.stage === "done") {
                  st.result = j.result || null;
                  if (!st.result || !st.result.out_dir) {
                    st.msg = "已生成，到输出目录查看";
                  } else if (st.result.mode === "narration") {
                    st.msg = "旁白已生成，还没插回原声（文件在下方）";
                  } else {
                    st.msg = "已生成，成品在下方（可直接在访达里打开）";
                  }
                  var pc = st.result && st.result.pace;
                  if (pc && pc.reason) st.msg = "语速对齐：" + pc.reason + "。" + st.msg;
                } else {
                  st.result = null;
                  st.msg = "出错：" + (j.error || "未知原因");
                }
                paint();
              }
            })
            .catch(function () {});
        }, 700);
      })
      .catch(function (e) {
        st.msg = "失败：" + (e.message || e);
        paint();
      });
  }

  /* ---------- 三条微调轨道 ----------
   *
   * 三个点各占一条轨道，各自以自己的打点为中心画同一段波形。
   * 中间那条固定的竖线才是打点的位置：把波形往右拖，等于让竖线指向更早的内容，
   * 也就是把打点往前挪。
   *
   * 波形不是整轨压成的粗粒度概览 —— 那样放大到秒级以下就糊了。这里只向后端
   * 要「打点附近一小段、固定毫秒级格宽」的波形，长片也一样快。
   */

  var HALVES = [0.25, 0.5, 1, 2, 4, 8];    // 轨道可见的半窗口（秒）
  var halfIdx = 2;
  var PEAKS = { a: null, b: null, c: null };
  var pending = { a: false, b: false, c: false };
  var dragging = null;
  var CSSV = {};
  var LANE_H = 46;

  function readCss() {
    var s = getComputedStyle(document.documentElement);
    ["--bread", "--cheese", "--muted", "--accent"].forEach(function (n) {
      CSSV[n] = s.getPropertyValue(n).trim();
    });
  }
  function half() { return HALVES[halfIdx]; }

  /** 打点不能越过邻居，也不能出界 —— 拖到底就停在那儿，不让它错位。 */
  function clampMark(role, t) {
    // 时长还没拿到时先放开上界，否则会把 C 一路钳到 0
    var lo = 0, hi = (st.dur > 0) ? st.dur : Infinity;
    if (role === "a") {
      hi = (st.b !== null ? st.b : (st.c !== null ? st.c : hi)) - 0.001;
    } else if (role === "b") {
      lo = (st.a !== null ? st.a : 0) + 0.001;
      hi = (st.c !== null ? st.c : hi) - 0.001;
    } else {
      lo = (st.b !== null ? st.b : (st.a !== null ? st.a : 0)) + 0.001;
    }
    if (hi < lo) hi = lo;
    return Math.min(Math.max(t, Math.max(0, lo)), hi);
  }

  function peaksFresh(role) {
    var p = PEAKS[role], t = st[role];
    if (!p || !p.peaks || t === null) return false;
    // 留出两倍窗口的余量，拖动时不至于每动一下就要重新解码
    var margin = half() * 2;
    return t - margin >= p.t0 && t + margin <= p.t0 + p.span;
  }

  function ensurePeaks(role) {
    var t = st[role];
    if (t === null || !st.path) { PEAKS[role] = null; return; }
    if (peaksFresh(role) || pending[role]) return;
    pending[role] = true;
    var span = Math.min(60, Math.max(4, half() * 12));
    fetch(API + "/api/peaks?path=" + encodeURIComponent(st.path) +
          "&center=" + t + "&span=" + span)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        pending[role] = false;
        if (d && d.peaks) { PEAKS[role] = d; drawLane(role); }
      })
      .catch(function () { pending[role] = false; });
  }

  function drawLane(role) {
    var cv = el("lc" + role.toUpperCase());
    if (!cv || !cv.getContext) return;
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 240;
    if (cv.width !== Math.round(w * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(LANE_H * dpr);
    }
    var g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, LANE_H);

    var t = st[role], p = PEAKS[role];
    g.font = '11px -apple-system, "PingFang SC", sans-serif';
    g.textAlign = "center";
    if (t === null) {
      g.fillStyle = CSSV["--muted"] || "#888";
      g.fillText("先打点，再拖波形微调", w / 2, LANE_H / 2 + 4);
      return;
    }
    if (p && p.peaks && p.peaks.length) {
      var t0 = t - half(), n = p.peaks.length;
      g.fillStyle = (role === "b") ? (CSSV["--cheese"] || "#e0a458")
                                   : (CSSV["--bread"] || "#9a7b4f");
      for (var x = 0; x < w; x++) {
        var ta = t0 + (x / w) * half() * 2;
        var tb = t0 + ((x + 1) / w) * half() * 2;
        var i0 = Math.floor((ta - p.t0) / p.res);
        var i1 = Math.ceil((tb - p.t0) / p.res);
        if (i1 <= i0) i1 = i0 + 1;
        if (i0 < 0) i0 = 0;
        if (i1 > n) i1 = n;
        if (i0 >= n) continue;
        var v = 0;
        for (var i = i0; i < i1; i++) { if (p.peaks[i] > v) v = p.peaks[i]; }
        var bh = Math.max(1, v * (LANE_H - 8));
        g.fillRect(x, (LANE_H - bh) / 2, 1, bh);
      }
    } else {
      g.fillStyle = CSSV["--muted"] || "#888";
      g.fillText("波形读取中…", w / 2, LANE_H / 2 + 4);
    }
    // 中线：这一条才是打点所在的位置
    g.fillStyle = CSSV["--accent"] || "#d8893b";
    g.fillRect(Math.round(w / 2) - 0.75, 0, 1.5, LANE_H);

    drawPlayhead(g, w, t - half(), t + half());
  }

  /**
   * 播放头。轴能看见的只有 [t0, t1] 这一小段，播放头落在里面就画一条随播移动的
   * 竖线（带三角，好跟中间那条固定的打点竖线区分）；落到窗外只在边缘画个箭头 ——
   * 播 A→C 那种长区间时，播放头多半已经扫出视野了。
   */
  function drawPlayhead(g, w, t0, t1) {
    var head = CSSV["--text"] || "#e8e6e3";
    var span = t1 - t0;
    if (st.pos >= t0 && st.pos <= t1) {
      var px = ((st.pos - t0) / span) * w;
      g.fillStyle = head;
      g.fillRect(px - 0.5, 0, 1, LANE_H);
      g.beginPath();
      g.moveTo(px - 3.5, 0); g.lineTo(px + 3.5, 0); g.lineTo(px, 5.5);
      g.closePath(); g.fill();
      return;
    }
    if (!st.playing) return;
    var right = st.pos > t1;
    var ex = right ? w - 5 : 5;
    g.fillStyle = head;
    g.beginPath();
    if (right) { g.moveTo(ex + 4, LANE_H - 8); g.lineTo(ex + 4, LANE_H - 2); g.lineTo(ex, LANE_H - 5); }
    else { g.moveTo(ex - 4, LANE_H - 8); g.lineTo(ex - 4, LANE_H - 2); g.lineTo(ex, LANE_H - 5); }
    g.closePath(); g.fill();
  }

  /**
   * 播一条轴。播的就是这条轴上能看见的那一小段（± 波形宽度），
   * 所以播放头一定会在视野里从左扫到右 —— 微调时听得见也看得见。
   */
  function playLane(role) {
    var h = half();
    send("playRange", {
      from: Math.max(0, st[role] - h), to: st[role] + h,
      label: role.toUpperCase() + " 附近 ±" + h.toFixed(2) + "s",
    });
    if (useBridge) {
      // 插件要下一轮才把 playing 推回来，这里先乐观地切一下，别让按钮慢半拍
      st.playing = true;
      st.playRole = role;
      st.prange = { from: Math.max(0, st[role] - h), to: st[role] + h };
    } else {
      st.msg = "已跳到这一段开头（没走官方桥时不会自动停）";
    }
    paint();
  }

  document.querySelectorAll("[data-play]").forEach(function (b) {
    b.addEventListener("click", function () {
      var role = b.getAttribute("data-play");
      if (st[role] === null) { st.msg = "先打上这个点，才能听它附近"; paint(); return; }
      if (st.playing && st.playRole === role) {   // 再点一次就是停
        send("stop");
        st.playing = false; st.playRole = null; st.prange = null;
        paint();
        return;
      }
      playLane(role);
    });
  });

  function refreshLanes() {
    ["a", "b", "c"].forEach(function (role) {
      el("lv" + role.toUpperCase()).textContent =
        (st[role] === null) ? "未打点" : fmtMs(st[role]);
      ensurePeaks(role);
      drawLane(role);
    });
  }

  ["a", "b", "c"].forEach(function (role) {
    var cv = el("lc" + role.toUpperCase());
    var startX = 0, startT = 0, moved = false;

    cv.addEventListener("pointerdown", function (e) {
      if (st[role] === null) return;
      dragging = role;
      startX = e.clientX;
      startT = st[role];
      moved = false;
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      e.preventDefault();
    });

    cv.addEventListener("pointermove", function (e) {
      if (dragging !== role) return;
      var w = cv.clientWidth || 240;
      if (Math.abs(e.clientX - startX) > 1) moved = true;
      // 波形往右拖 → 竖线指向更早的内容 → 打点往前挪
      var dt = (e.clientX - startX) / w * half() * 2;
      st[role] = clampMark(role, startT - dt);
      paint();          // paint 末尾会顺带刷新三条轨道
    });

    // 松手才落库：拖动过程中一直往插件发消息既吵，也会让播放器不停跳转
    cv.addEventListener("pointerup", function (e) {
      if (dragging !== role) return;
      dragging = null;
      try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      if (!moved) return;
      send("setMarkAt", { role: role, t: st[role] });
      if (st.playing && st.playRole === role) {
        playLane(role);   // 边听边挪：松手就接着从新位置播，不必再点一次
      } else {
        send("goto", { t: st[role] });   // 跳过去听一下，确认落在哪个字前面
      }
      ensurePeaks(role);
    });
    cv.addEventListener("pointercancel", function () { dragging = null; });
  });

  el("zoom").oninput = function (e) {
    halfIdx = (+e.target.value) || 0;
    el("zoom-v").textContent = "±" + half().toFixed(2) + "s";
    // 缩放一变，需要的分辨率与窗口长度都变了，缓存全部作废
    PEAKS = { a: null, b: null, c: null };
    refreshLanes();
  };

  /**
   * A→C 试听条。整片的进度不用在面板里再画一条（播放器自己就有），
   * 但「旁白要照着来的那一段」值得单独一条：A 与 C 打好后出现，
   * 试听时播放头在里面走，B 的位置也标在上面 —— 一眼看出旁白会插在哪儿。
   */
  function paintRefbar() {
    var ok = st.a !== null && st.c !== null && st.c > st.a;
    el("refWrap").style.display = ok ? "block" : "none";
    if (!ok) return;
    var span = st.c - st.a;
    var at = function (t) { return ((t - st.a) / span * 100) + "%"; };

    var hasB = st.b !== null && st.b > st.a && st.b < st.c;
    el("rbB").style.display = hasB ? "block" : "none";
    if (hasB) el("rbB").style.left = at(st.b);

    // 播放头只在落进 A→C 时才画：在这段之外，它对试听没有意义
    var inside = st.pos >= st.a && st.pos <= st.c;
    el("rhead").style.display = inside ? "block" : "none";
    if (inside) el("rhead").style.left = at(st.pos);

    el("rbA").textContent = fmtMs(st.a);
    el("rbC").textContent = fmtMs(st.c);
    el("rbLen").textContent = span.toFixed(2) + "s" +
      (hasB ? " · B 在 " + (st.b - st.a).toFixed(2) + "s" : "");

    // 正在播的就是 A→C 时把这条点亮，说明「现在听的是这一段」
    var pr = st.prange;
    var on = !!(st.playing && pr && pr.from <= st.a + 0.01 && pr.to >= st.c - 0.01);
    el("refbar").className = "refbar" + (on ? " on" : "");
  }

  // 点条上任意一处就跳过去 —— 想从中间听一句，不必先拖播放器
  el("refbar").addEventListener("click", function (e) {
    if (!(st.a !== null && st.c !== null && st.c > st.a)) return;
    var box = el("refbar");
    var r = (box.getBoundingClientRect && box.getBoundingClientRect()) ||
            { left: 0, width: box.clientWidth || 0 };
    var f = Math.min(1, Math.max(0, (e.clientX - (r.left || 0)) / (r.width || 1)));
    var t = st.a + f * (st.c - st.a);
    st.pos = t;                 // 插件下一轮才把新位置推回来，先自己挪一下
    send("goto", { t: t });
    paint();
  });

  function paint() {
    el("file").textContent = st.file || "未在播放";
    el("file").title = st.file || "";
    el("pos").textContent = fmt(st.pos);
    el("dur").textContent = " / " + fmt(st.dur);

    ["a", "b", "c"].forEach(function (k) {
      var v = st[k];
      el("m" + k.toUpperCase()).querySelector(".v").textContent = fmtMs(v);
      el("m" + k.toUpperCase()).className = "mark" + (v !== null ? " set" : "");
      // 哪条轴在播，就把它的键切成停止
      var pb = el("lp" + k.toUpperCase());
      var on = st.playing && st.playRole === k;
      pb.textContent = on ? "■" : "▶";
      pb.className = "mini" + (on ? " on" : "");
      pb.title = on ? "停止" : "播放这条轴上看到的这一小段";
    });

    paintRefbar();

    // 只合成旁白只要有参考区间 A→C 就能跑（B 只是给参考窗口一个偏好位置）；
    // 要插回去才必须有 A<B<C
    var base = st.backend && !!st.path && st.a !== null && st.c !== null &&
               st.a < st.c && el("text").value.trim().length > 0 && !st.job;
    var ready = base && st.b !== null && st.a < st.b && st.b < st.c;
    el("btnNar").disabled = !base;
    el("btnGen").disabled = !ready;
    el("dot").className = "dot " + (st.backend ? "on" : "off");

    var out = (st.result && st.result.out_dir) ? st.result.out_dir : "";
    el("outBox").style.display = out ? "block" : "none";
    if (out) {
      var name = (st.result.out_wav || "").split("/").pop();
      el("outPath").textContent =
        (st.result.mode === "narration" ? "旁白：" : "成品：") + (name || out);
    }
    if (st.notice) {
      el("st").textContent = st.notice.text;
      el("st").style.color = st.notice.is_error ? "var(--bad)" : "";
    } else {
      el("st").textContent = st.msg ||
        (st.backend ? "已连接本机服务" : "未连到本机服务（先跑 ./run.sh）");
      el("st").style.color = "";
    }
    refreshLanes();
  }

  document.querySelectorAll("[data-set]").forEach(function (b) {
    b.addEventListener("click", function () {
      setMark(b.getAttribute("data-set").toLowerCase());
    });
  });
  el("btnReset").addEventListener("click", clearMarks);
  // 播放控制只能由插件做（面板拿不到 iina.core），这里只是下个指令
  el("btnPrev").addEventListener("click", function () {
    if (st.a === null || st.c === null) {
      st.msg = "先打上 A 和 C 才能试听";
      paint();
      return;
    }
    if (st.playing) {           // 正在播就先停下，不管播的是哪一段
      send("stop");
      st.playing = false; st.playRole = null; st.prange = null;
      st.msg = "已停止";
    } else {
      send("preview");
      st.playRole = null;
      st.msg = "正在播放 A→C，旁白会照这段的语气来";
    }
    paint();
  });
  readCss();
  el("zoom-v").textContent = "±" + half().toFixed(2) + "s";

  el("text").addEventListener("input", paint);
  el("btnNar").addEventListener("click", function () { run("narration"); });
  el("btnGen").addEventListener("click", function () { run("sandwich"); });
  el("btnReveal").addEventListener("click", function () {
    var p = st.result && (st.result.out_wav || st.result.out_dir);
    if (!p) return;
    post("/api/reveal", { path: p });
  });

  paint();
})();
</script>
</body>
</html>
