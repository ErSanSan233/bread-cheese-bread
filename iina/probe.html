<!doctype html>
<meta charset="utf-8" />
<title>BCB 连通性测试</title>
<style>
  body { font: 13px/1.6 -apple-system, system-ui, sans-serif; margin: 24px; }
  h1 { font-size: 15px; }
  pre { background: #f4f4f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  .ok { color: #1a7f37; }
  .bad { color: #b42318; }
</style>

<h1>WebView 连通性测试</h1>
<p>测试项：① webview → 插件桥是否可用 ② fetch 能否直连本机后端 ③ XHR 是否可用。</p>
<pre id="out">运行中…</pre>

<script>
  var PORT = 8733;
  var out = document.getElementById("out");
  var lines = [];
  var result = { readyPosted: null, fetch: null, xhr: null, bridge: null };

  function log(s, cls) {
    lines.push(s);
    out.textContent = lines.join("\n");
    if (cls) out.className = cls;
  }

  // ① 桥：页面一加载就先回报一次，和网络状况无关
  function postToPlugin(name, data) {
    var errs = [];
    try {
      iina.postMessage(name, data);
      return { via: "全局 iina", errs: errs };
    } catch (e) {
      errs.push("全局 iina: " + e);
    }
    try {
      window.iina.postMessage(name, data);
      return { via: "window.iina", errs: errs };
    } catch (e2) {
      errs.push("window.iina: " + e2);
    }
    return { via: null, errs: errs };
  }

  // IINA 是在页面加载过程中才注入 window.iina 的，内联脚本跑得比它早，
  // 所以要轮询等桥就绪，不能假设一开始就有。
  function whenBridgeReady(cb) {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (window.iina && typeof window.iina.postMessage === "function") {
        clearInterval(timer);
        cb(true, tries);
      } else if (tries > 100) {
        clearInterval(timer);
        cb(false, tries);
      }
    }, 50);
  }

  // ① 桥：等注入完成后先回报一次，与网络状况无关
  window.addEventListener("load", function () {
    whenBridgeReady(function (ready, tries) {
      var post = ready
        ? postToPlugin("probeResult", {
            stage: "page-ready",
            桥已就绪: ready,
            轮询次数: tries,
            ua: navigator.userAgent,
          })
        : { via: null, errs: ["window.iina 始终未出现"] };
      result.readyPosted = post;
      result.bridge = { ready: ready, tries: tries };
      log("① 桥：" + (ready ? "已就绪（第 " + tries + " 次轮询）" : "始终未出现"), ready ? "ok" : "bad");
      log("   回传方式：" + (post.via || "失败：" + post.errs.join(" | ")));
      startNetworkTests();
    });
  });

  // 把 location.search 原样发给后端，后端访问日志能直接看到 —— 用来验证
  // 「能否通过 URL 把当前文件路径/播放位置传给页面」这条不依赖桥的路子。
  function reportQuery() {
    try {
      fetch(
        "http://127.0.0.1:" +
          PORT +
          "/api/health?from=webview-query&q=" +
          encodeURIComponent(location.search),
      ).catch(function () {
        /* 忽略 */
      });
    } catch (e) {
      /* 忽略 */
    }
  }

  var _networkStarted = false;
  function startNetworkTests() {
    if (_networkStarted) return;
    _networkStarted = true;
    reportQuery();

  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise(function (resolve) {
        setTimeout(function () {
          resolve({ ok: false, error: label + " 超时 " + ms + "ms（疑似被拦）" });
        }, ms);
      }),
    ]);
  }

  // 各请求用不同标记 —— 后端访问日志会打印完整路径，据此判断到底谁发的
  function tryFetch() {
    return withTimeout(
      new Promise(function (resolve) {
        fetch("http://127.0.0.1:" + PORT + "/api/health?from=webview-fetch")
          .then(function (r) { return r.text(); })
          .then(function (t) { resolve({ ok: true, text: t.slice(0, 200) }); })
          .catch(function (e) { resolve({ ok: false, error: String(e) }); });
      }), 6000, "fetch");
  }

  function tryXHR() {
    return withTimeout(
      new Promise(function (resolve) {
        try {
          var xhr = new XMLHttpRequest();
          xhr.timeout = 5000;
          xhr.open("GET", "http://127.0.0.1:" + PORT + "/api/health?from=webview-xhr", true);
          xhr.onload = function () {
            resolve({ ok: true, status: xhr.status, text: String(xhr.responseText).slice(0, 200) });
          };
          xhr.onerror = function () { resolve({ ok: false, error: "XHR onerror" }); };
          xhr.ontimeout = function () { resolve({ ok: false, error: "XHR 超时" }); };
          xhr.send();
        } catch (e) { resolve({ ok: false, error: String(e) }); }
      }), 7000, "XHR");
  }

  function finish() {
    log("");
    log("已回报给插件。");
    postToPlugin("probeResult", result);
  }

  tryFetch()
    .then(function (r) {
      result.fetch = r;
      log("② fetch：" + (r.ok ? "成功 → " + r.text.slice(0, 90) : "失败 → " + r.error), r.ok ? "ok" : "bad");
      return tryXHR();
    })
    .then(function (r) {
      result.xhr = r;
      log("③ XHR：" + (r.ok ? "成功 → " + r.status : "失败 → " + r.error), r.ok ? "ok" : "bad");
      finish();
    });
  }

  // 保险：万一 load 事件没触发（WKWebView 的某些时机），5 秒后自己启动
  setTimeout(startNetworkTests, 5000);
</script>
